/* ================= approach dispersion — its own store =================
   Keyed by round date + course + hole, plus the shot index so two approaches
   on one hole stay distinct.

   Deliberately NOT in `state.cells`. Cells ARE the round record: they seed the
   ntfy channel, clearRound wipes them, and buildRoundJSON reads them. Keeping
   dispersion outside them is what guarantees it can never reach the round
   record, the Apps Script or the Google Sheet, and that a round logged with no
   dispersion saves byte-identically to before this feature existed.

   The store is origin-scoped localStorage, and the Golf Hub is on the same
   origin, so the maps read it with no server and no sheet column. The trade is
   that it is per-device: nothing syncs it between his phone and his iPad, and
   clearing site data clears it. Round data is untouched either way.

   NO BACKFILL. Only a capture Eric actually taps writes a record. Nothing here
   reads putt distance, leave, or any other field to reconstruct a component
   for a round logged before these fields existed. Those rounds have no
   dispersion data and never will — the maps start empty and fill going
   forward, by design. */
const DISP_STORE_KEY = "gh_dispersion_v1";

function dispLoadAll(){
  try {
    const raw = JSON.parse(localStorage.getItem(DISP_STORE_KEY));
    return raw && Array.isArray(raw.shots) ? raw.shots : [];
  } catch(e){ return []; }
}
function dispSaveAll(shotsArr){
  try {
    localStorage.setItem(DISP_STORE_KEY, JSON.stringify({ v: DISP_VERSION, shots: shotsArr }));
    return true;
  } catch(e){ return false; }
}
const dispRowId = (hn, idx) => dispKey(ROUND.date, ROUND.course, hn) + "|" + idx;
function dispGet(hn, idx){
  const id = dispRowId(hn, idx);
  return dispLoadAll().find(r => r.id === id) || null;
}
/* Upsert on the same id, so re-editing a shot corrects its record rather than
   stacking a second dot on the map. */
function dispUpsert(hn, idx, rec){
  const all = dispLoadAll();
  const id = dispRowId(hn, idx);
  const row = Object.assign({
    id, date: ROUND.date, course: ROUND.course, hole: hn, shot_idx: idx, t: Date.now()
  }, rec);
  const at = all.findIndex(r => r.id === id);
  if (at === -1) all.push(row); else all[at] = row;
  return dispSaveAll(all);
}
/* The hole's leave, for the ROUND PAYLOAD (Eric, 2026-08-02: "Yes will need
   that for the future. starting with my round tomorrow").

   This deliberately REVERSES the 2026-07-31 decision to keep dispersion out of
   the round record. That design made the capture per-device and per-browser:
   clear the site data and the numbers are gone, and they never reach the sheet
   where every other stat he owns lives. He asked for Hole Log columns, so the
   two signed leaves now travel with the round.

   ONLY these two fields cross over, and only as EXTRA keys. Nothing existing in
   the payload changes shape or value, so an Apps Script that predates the new
   columns simply ignores them and writes exactly what it wrote before.

   A hole can hold more than one capture. The LAST one (highest shot index) is
   the approach that actually determined the leave, so that is the one that
   travels. Returns {} when the hole has no capture, which keeps the key absent
   rather than null -- an un-captured hole and an older round look identical. */
function dispForHole(hn){
  const recs = dispLoadAll()
    .filter(r => r.hole === hn && r.date === ROUND.date && r.course === ROUND.course)
    .sort((a, b) => (a.shot_idx || 0) - (b.shot_idx || 0));
  const r = recs[recs.length - 1];
  if (!r) return {};
  const out = {};
  if (typeof r.leave_long_ft === "number") out.leave_long_ft = r.leave_long_ft;
  if (typeof r.leave_right_ft === "number") out.leave_right_ft = r.leave_right_ft;
  return out;
}

/* Deleting shot i drops its record and slides every later shot on that hole
   down one, so the ids keep matching the shots they describe. Without this a
   deleted shot would leave its dot attached to whatever shot inherited the
   index. */
function dispShiftAfterDelete(hn, idx){
  const prefix = dispKey(ROUND.date, ROUND.course, hn) + "|";
  const all = dispLoadAll().filter(r => r.id !== prefix + idx);
  all.forEach(r => {
    if (r.hole === hn && r.date === ROUND.date && r.course === ROUND.course &&
        typeof r.shot_idx === "number" && r.shot_idx > idx){
      r.shot_idx -= 1;
      r.id = prefix + r.shot_idx;
    }
  });
  dispSaveAll(all);
}

/* The editor's dispersion inputs live on `editing.disp`, never on
   `editing.draft` — draft is spread into the shot object, and nothing from
   here may ride along into it. */
function dispDraftFor(idx){
  const saved = idx === -1 ? null : dispGet(hole, idx);
  if (!saved) return {};
  /* Re-open a saved record in the same unsigned terms he typed it in. The sign
     is a storage detail; he never sees one and never types one. */
  /* Storage is feet. Show him the number he TYPED, in the unit he typed it
     in — otherwise a 20 yard miss re-opens reading 60 against a "yd" label,
     and saving it again stores 180. */
  const u = saved.entered_unit === "yd" ? "yd" : "ft";
  const lf = saved.leave_long_ft, rf = saved.leave_right_ft;
  return {
    long_ft:  lf == null ? "" : dispFromFeet(Math.abs(lf), u),
    long_dir: lf == null || lf === 0 ? "" : (lf < 0 ? "short" : "long"),
    right_ft: rf == null ? "" : dispFromFeet(Math.abs(rf), u),
    right_dir: rf == null || rf === 0 ? "" : (rf < 0 ? "left" : "right"),
    lie: saved.lie, finish: saved.finish,
    played_from_yds: saved.played_from_yds == null ? "" : saved.played_from_yds,
    _saved: true
  };
}

/* What he typed, over what the shot ALREADY SAYS.
   `editing.disp` holds only the two distances he types. Everything else is
   read off the shot he is logging right now, because it is all already on the
   screen and he should never enter the same fact twice:

     direction  <- the Miss chips (Left / Right / Short / Long)
     lie        <- the shot's own Lie select, folded to the four flags
     finished   <- no finish distance means it finished on the green
     played from<- the shot's own Start (yd)

   Nothing is inferred for the two distances themselves. Those are his. */
function dispEffective(d){
  const v = editing.disp || {};
  const tags = accTags(d.acc);
  /* ON THE GREEN he measures in FEET, anywhere else in YARDS — the Green chip
     in Finish is what says which. Until he taps a Finish chip the boxes read
     feet, because an approach that reaches the green is the ordinary case and
     the label flips the instant he says otherwise. The unit is resolved again
     at save, so a number typed before the chip was tapped still stores with
     the unit he ended on. */
  const onGreen = tags.includes("Green") ||
    (!tags.some(t => ["Fairway","Rough","Deep Rough","Sand","Water","OB","Unplayable","Layup","Other"].includes(t)));
  return {
    long_ft:  v.long_ft  === undefined ? "" : v.long_ft,
    right_ft: v.right_ft === undefined ? "" : v.right_ft,
    long_dir:  dispDirFrom(tags, "long", "short"),
    right_dir: dispDirFrom(tags, "right", "left"),
    unit: dispUnit(onGreen),
    lie: dispLieFromShotLie(d.lie),
    finish: onGreen ? "On green" : "Off green",
    played_from_yds: d.db == null ? "" : d.db
  };
}

/* The capture, in full: two number boxes under the Miss chips.
   The chip above says which way it missed, so the box only has to say how far.
   Feet, unsigned, exactly as he would say it out loud. Blank means he is not
   logging dispersion for this shot, and 0 is a real answer - 0 long is pin
   high, 0 right is dead on line, and neither needs a chip. */
function dispMissFields(d){

/* ---------- green elevation (USGS 3DEP lidar, aligned to the green image) ----
   BOOK[n].z = {g: base64 bytes, n: grid size, z0/zs: feet decode, wft/hft: the
   image frame's real size in feet}. A tap at normalized (x,y) on the green image
   is therefore a real point with a real height. ~1 m source posting: this reads
   the general tilt and the tiers, NOT sub-metre break. */
const ZCACHE = {};
function zdata(holeN){
  const meta = BOOK[holeN], z = meta && meta.z;
  if (!z) return null;
  if (!ZCACHE[holeN]){
    const bin = atob(z.g), a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    ZCACHE[holeN] = Object.assign({}, z, {a});
  }
  return ZCACHE[holeN];
}
function zAt(zd, nx, ny){                     // feet, bilinear
  const n = zd.n;
  const fx = Math.min(Math.max(nx*n - 0.5, 0), n-1);
  const fy = Math.min(Math.max(ny*n - 0.5, 0), n-1);
  const i0 = Math.floor(fx), j0 = Math.floor(fy);
  const i1 = Math.min(i0+1, n-1), j1 = Math.min(j0+1, n-1);
  const tx = fx-i0, ty = fy-j0;
  const g = (i,j) => zd.z0 + zd.a[j*n+i]*zd.zs;
  return (g(i0,j0)*(1-tx) + g(i1,j0)*tx)*(1-ty) + (g(i0,j1)*(1-tx) + g(i1,j1)*tx)*ty;
}
/* The putt as the chart wants it: length, cross-slope %, along-slope %.
   ball -> hole; cross is measured perpendicular to that line, along is the rise
   between the two ends. Gradients use a ~7 ft window (about two lidar posts) so
   a single noisy cell can't swing the read. */
function puttGeom(holeN){
  const zd = zdata(holeN), p = pins[holeN], b = balls[holeN];
  if (!zd || !p || !b) return null;
  const dxf = (p.x-b.x)*zd.wft, dyf = (p.y-b.y)*zd.hft;   // ball -> hole, feet
  const dist = Math.hypot(dxf, dyf);
  if (dist < 1) return null;
  const ux = dxf/dist, uy = dyf/dist;
  const zb = zAt(zd, b.x, b.y), zp = zAt(zd, p.x, p.y);
  const along = (zb - zp)/dist*100;            // + => ball above hole => downhill
  // cross-slope at the middle of the putt, perpendicular to the line
  const mx = (p.x+b.x)/2, my = (p.y+b.y)/2;
  const hx = 3.5/zd.wft, hy = 3.5/zd.hft;
  const gx = (zAt(zd, Math.min(mx+hx,1), my) - zAt(zd, Math.max(mx-hx,0), my))/7;
  const gy = (zAt(zd, mx, Math.min(my+hy,1)) - zAt(zd, mx, Math.max(my-hy,0)))/7;
  const rx = -uy, ry = ux;                     // 90 deg right of the putt line (image y down)
  const cross = (gx*rx + gy*ry)*100;           // + => ground rises to the right
  return { dist, along, cross: Math.abs(cross),
           high: cross > 0 ? "right" : "left" };
}
const nearest = (v, arr) => arr.reduce((a,c) => Math.abs(c-v) < Math.abs(a-v) ? c : a, arr[0]);
/* Push the measured putt into the Putting tab's inputs (snapped to the chart's
   own rows) and read the break. Auto-filled, always overridable. */
function applyPuttGeom(holeN){
  const g = puttGeom(holeN);
  if (!g) return null;
  puttIn.len = Math.round(g.dist);
  puttIn.slope = String(nearest(g.cross, BREAK_SLOPES));
  const a = Math.abs(g.along);
  puttIn.ud = a < 0.5 ? "flat"
    : (g.along > 0 ? "d" : "u") + String(Math.min(3, Math.max(1, Math.round(a))));
  puttIn.out = puttRead(g.high);
  return g;
}

/* ---------- putting: break read + the chart ---------- */
function fmtBreak(v){
  if (v < 10) return (Math.round(v*10)/10) + '"';
  if (v < 36) return Math.round(v) + '"';
  return Math.floor(v/12) + "'" + Math.round(v%12) + '"';
}
function breakInterp(stimp, slopeIdx, ft){
  const row = BREAK[stimp][slopeIdx];
  const f = Math.max(BREAK_FT[0], Math.min(ft, BREAK_FT[BREAK_FT.length-1]));
  for (let i = 1; i < BREAK_FT.length; i++){
    if (f <= BREAK_FT[i]){
      const f0 = BREAK_FT[i-1], f1 = BREAK_FT[i];
      return row[i-1] + (f-f0)/(f1-f0)*(row[i]-row[i-1]);
    }
  }
  return row[row.length-1];
}
function slopeIndex(){
  const i = BREAK_SLOPES.indexOf(parseFloat(puttIn.slope));
  return i < 0 ? 3 : i;
}
function puttRead(side){
  if (puttIn.len == null) return "Give me a putt length first.";
  const flat = breakInterp(puttIn.stimp, slopeIndex(), puttIn.len);
  const fac = puttIn.ud === "flat" ? 1 : BREAK_UD[puttIn.stimp][puttIn.ud];
  const v = flat * fac;
  // when the green map measured the putt we know which way it breaks — say so
  const hi = side ? `the ${side} edge` : "the high edge";
  const to = side ? `${side} of the cup` : "to the high side of the cup";
  const lines = [ v < INSIDE_EDGE
    ? `Play it ${fmtBreak(v)} inside ${hi} of the cup.`
    : `Aim ${fmtBreak(v)} ${to}.` ];
  if (puttIn.ud !== "flat"){
    const lbl = (UD_LABELS.find(u => u[0] === puttIn.ud) || ["",""])[1];
    lines.push(`${lbl}: flat read ${fmtBreak(flat)}.`);
  }
  if (puttIn.len > 60) lines.push("Chart tops out at 60 ft - 60 ft read shown.");
  return lines.join("<br>");
}
function puttChart(){
  const sel = slopeIndex(), grid = BREAK[puttIn.stimp];
  const chunk = (lo, hi) => {
    const head = `<th>Slope</th>` + BREAK_FT.slice(lo,hi).map(f => `<th>${f}'</th>`).join("");
    const rows = grid.map((row, si) => {
      let cells = "";
      for (let i = lo; i < hi; i++){
        cells += `<td class="${row[i] < INSIDE_EDGE ? "ins" : ""}">${fmtBreak(row[i])}</td>`;
      }
      const cls = si === sel ? "selrow" : (si % 2 ? "zeb" : "");
      return `<tr class="${cls}"><td class="cl">${BREAK_SLOPES[si]}%</td>${cells}</tr>`;
    }).join("");
    return `<table class="chart puttchart"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  };
  return `<div class="puttlbl">Break chart &middot; stimp ${puttIn.stimp} &middot; read to pin</div>` +
    chunk(0,4) + chunk(4,8) + chunk(8,12) + chunk(12,16);
}
function puttBody(){
  const a = puttGeom(hole);        // live for THIS hole — never a stale snapshot
  // when the green map has already measured the putt the fields speak for
  // themselves — only say something when there is nothing to show yet
  const banner = (!a && zdata(hole))
    ? `<div class="autonote">Drop the pin and your ball on the
         <b>Green</b> tab to fill this in</div>` : "";
  return banner + `

      <div class="edfield"><div class="edlbl">Up or down</div>

    <div class="caddyout" id="puttout">${puttIn.out || ""}</div>
    ${puttChart()}`;
}

function bookBody(){
  /* GPS is a segment of the course book, sitting next to Hole (Eric,
     2026-08-02). It is checked BEFORE the BOOK[hole] guard because the
     rangefinder does not depend on a hole having a book page. */
  if (bookView === "gps") return GPS_PACK ? viewGPS() : "";
  const meta = BOOK[hole];
  if (!meta) return "";
  if (bookView === "strat"){
    return strategyFor(HOLES[hole-1]);
  }
  if (bookView === "green"){
    const p = pins[hole], t = targetFor(hole);
    const pinSvg = p ? `<svg class="pinmark" style="left:${p.x*100}%;top:${p.y*100}%" viewBox="0 0 26 34">
        <line x1="4" y1="2" x2="4" y2="31" stroke="#0C2340" stroke-width="2.6"/>
        <path d="M5.5 2.5 L23 7.5 L5.5 13 Z" fill="#B22234" stroke="#8F1B2A" stroke-width="1"/>
        <circle cx="4" cy="31" r="3" fill="#0C2340"/>
      </svg>` : "";
    const tgtDiv = t ? `<div class="targetmark" style="left:${t.x*100}%;top:${t.y*100}%"></div>` : "";
    const b = balls[hole], zd = zdata(hole);
    const ballSvg = b ? `<div class="ballmark" style="left:${b.x*100}%;top:${b.y*100}%"></div>` : "";
    const lineSvg = (p && b) ? `<svg class="puttline" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="${b.x*100}" y1="${b.y*100}" x2="${p.x*100}" y2="${p.y*100}"
              stroke="#F4EFE4" stroke-width="0.7" stroke-dasharray="2 1.6" vector-effect="non-scaling-stroke"/>
      </svg>` : "";
    // measured putt, straight off the lidar grid
    const g = (p && b) ? puttGeom(hole) : null;
    const readout = g ? `<div class="puttread">
        <div class="prrow"><b>${Math.round(g.dist)} ft</b>
          &middot; <b>${g.cross.toFixed(1)}%</b> break, high side ${g.high}
          &middot; <b>${Math.abs(g.along) < 0.5 ? "flat"
              : Math.abs(g.along).toFixed(1)+"% "+(g.along>0?"downhill":"uphill")}</b>${
          g.cross > BREAK_SLOPES[BREAK_SLOPES.length-1]
            ? ` <span class="prwarn">steeper than the chart &mdash; read shown is the ${BREAK_SLOPES[BREAK_SLOPES.length-1]}% row</span>` : ""}</div>
        <div class="prout">${puttRead(g.high)}</div>
      </div>` : "";
    const hint = !zd
      ? (p ? `<span class="pinlgnd">Flag</span> = today's pin &middot; tap to move it`
           : `<b>Tap the green to drop today's pin</b>`)
      : (!p ? `<b>Tap the green to drop today's pin</b>`
            : (!b ? `<b>Now tap where you're putting from</b>`
                  : `<span class="pinlgnd">Flag</span> = pin &middot; <span class="balllgnd">Ball</span> = your putt
                     <br>${greenTap === "pin" ? "Tapping moves the PIN" : "Tapping moves the BALL"}`));
    const tip = p ? `<div class="pintip">${pinAdvice(hole)}</div>` : "";
    const toggle = (zd && p) ? `<div class="taptog">
        <button class="tapbtn ${greenTap==="pin"?"on":""}" data-tap="pin">Move pin</button>
        <button class="tapbtn ${greenTap==="ball"?"on":""}" data-tap="ball">My ball</button>
      </div>` : "";
    return `${toggle}
      <div class="bookframe greentap" data-role="greentap">
        <img class="bookimg" src="${meta.green}" alt="Green map, hole ${hole}" draggable="false">
        ${lineSvg}${pinSvg}${tgtDiv}${ballSvg}
      </div>
      <div class="greenkey"><b>blue low</b> / <b>red high</b></div>
      ${readout}${tip}
      <div class="bookhint">${hint}</div>
      ${p ? `<button class="pinclear" data-act="pinclear">Clear pin${b ? " and ball" : ""}</button>` : ""}`;
  }
  if (bookView === "club"){
    const cm = meta.clubmap, pick = clubPick[hole];
    const dTot = Math.round(Math.hypot((cm.tee[0]-cm.green[0])*cm.wyd,(cm.tee[1]-cm.green[1])*cm.hyd));
    const dg = pick ? Math.round(Math.hypot((pick.x-cm.green[0])*cm.wyd,(pick.y-cm.green[1])*cm.hyd)) : dTot;
    const dt = pick ? Math.round(Math.hypot((pick.x-cm.tee[0])*cm.wyd,(pick.y-cm.tee[1])*cm.hyd)) : null;
    const dot = pick ? `<div class="cdot" style="left:${pick.x*100}%;top:${pick.y*100}%"></div>` : "";
    const read = pick ? `From tee <b>${dt}</b> yds &middot; to green <b>${dg}</b> yds`
                      : `Tap the fairway &mdash; distance from the tee and to the middle of the green.`;
    return `<div class="bookframe greentap" data-role="clubtap">
        <img class="bookimg" src="${meta.club}" alt="Club map, hole ${hole}" draggable="false">
        <div class="cyd top">${dg} to green</div><div class="cyd bot">${pick?dt+" from tee":"Tee"}</div>${dot}
      </div><div class="bookhint">${read}</div>`;
  }
  return `<div class="bookframe">
      <img class="bookimg" src="${meta.hole}" alt="Hole ${hole} overview" draggable="false">
    </div>`;
}

function viewZoom(){
  const label = bookView==="green" ? "Green map" : bookView==="club" ? "Club map" : "Hole overview";
  return `<div class="zoom">
    <div class="zoomhead">
      <div class="zoomttl">No. ${hole} &middot; ${label}</div>
      <button class="zoomclose" data-act="zoomclose">Close</button>
    </div>
    <div class="zoombody">${bookBody()}</div>
  </div>`;
}

function viewOverview(){
  const t = totals();
  const toPar = t.thru ? plusMinus(t.score, t.par) : "&mdash;";
  const tiles = `
  <div class="totcard">
    <div class="tot"><div class="v">${t.thru?t.score:"&mdash;"} <em>${toPar}</em></div><div class="k">Score &middot; thru ${t.thru}</div></div>
    <div class="tot"><div class="v">${t.f9||"&mdash;"} / ${t.b9||"&mdash;"}</div><div class="k">Out / In</div></div>
    <div class="tot"><div class="v">${t.putts||"&mdash;"}</div><div class="k">Putts</div></div>
    <div class="tot"><div class="v">${t.fwP?`${t.fwH}/${t.fwP}`:"&mdash;"}</div><div class="k">Fairways</div></div>
    <div class="tot"><div class="v">${t.girP?`${t.girH}/${t.girP}`:"&mdash;"}</div><div class="k">Greens</div></div>
    <div class="tot"><div class="v">${t.udX?`${t.udC}/${t.udX}`:"&mdash;"}</div><div class="k">Up &amp; down</div></div>
  </div>`;
  const rows = HOLES.map(h => {
    const f = F(h.n);
    const d = f.score==null ? null : f.score - parFor(h.n);
    const mk = d==null ? "&middot;"
      : `<span class="mk ${d<=-2?"eag":d===-1?"brd":d===0?"parr":d===1?"bgy":"dbl"}">${f.score}</span>`;
    const yn = v => v==="Y" ? `<span class="ok">&#10003;</span>` : v==="N" ? `<span class="miss">&#10007;</span>` : "&middot;";
    return `<tr><td class="hn">${h.n}</td><td>${parFor(h.n)}</td>
      <td>${mk}</td>
      <td>${parFor(h.n)===3 ? "&mdash;" : yn(effFir(h))}</td><td>${yn(effGir(h))}</td>
      <td>${puttCount(h.n) ?? "&middot;"}</td><td>${f.pen || "&middot;"}</td></tr>`;
  }).join("");
  const sum = `<tr class="sumrow"><td colspan="2">TOT</td><td>${t.thru?t.score:"&middot;"}</td>
    <td>${t.fwP?`${t.fwH}/${t.fwP}`:"&middot;"}</td><td>${t.girP?`${t.girH}/${t.girP}`:"&middot;"}</td>
    <td>${t.putts||"&middot;"}</td><td>${t.pen||"&middot;"}</td></tr>`;
  return `${tiles}
  ${sgCard()}
  <div class="secthead">Hole by hole</div>
  <div class="gridwrap"><table class="grid">
    <thead><tr><th>Hole</th><th>Par</th><th>Score</th><th>FIR</th><th>GIR</th><th>Putts</th><th>Pen</th></tr></thead>
    <tbody>${rows}${sum}</tbody>
  </table></div>
  <div class="rnotes"><textarea id="rnote" placeholder="Round notes (conditions, story of the day)">${esc(rnote)}</textarea></div>
  <button class="savebtn" data-act="saveround">Save round &middot; send to Home Base</button>
  <div class="saveout" id="saveout">${lastExport ? saveOutHTML(true, false) : ""}</div>
  <button class="reset" data-act="reset">Clear round</button>`;
}

/* ---------- strokes gained, live in the Overview ----------
   Same engine Pencil Wedge uses on the VM (sg_engine.js, a verified port of
   pull_round.py), run on the phone so the round reads its own numbers before
   it is ever saved. Baseline 5 HCP to match the Golf Hub and the sheet.
   Only holes with logged shots count, so a part-played round reads honestly
   instead of scoring unplayed holes as losses.
   Layout: the four ball-striking categories add DOWN to Ball Striking
   (ball_strike = driver + p176 + p101 + p100); putting sits below it,
   outside that sum. */
const SG_LABEL = {driver:"Driver", p176:"176+", p101:"101-175", p100:"100 & In",
                  putting:"Putting", ball_strike:"Ball Striking"};
function sgCard(){
  const holes = buildRoundJSON().holes.filter(h => (h.shots || []).length);
  if (!holes.length){
    return `<div class="sgcard"><div class="sghead">Strokes Gained &middot; vs 5 HCP</div>
      <div class="sgnote">Log a shot and your strokes gained appears here, hole by hole.</div></div>`;
  }
  const tot = roundSG(holes, "5hcp");
  const row = (k, cls) => {
    const v = tot[k], pos = v >= 0;
    return `<div class="sgrow${cls || ""}"><div class="nm">${SG_LABEL[k]}</div>
      <div class="vl" style="color:${pos ? "#1E8E4F" : "#B22234"}">${pos ? "+" : ""}${v.toFixed(2)}</div></div>`;
  };
  return `<div class="sgcard">
    <div class="sghead">Strokes Gained &middot; vs 5 HCP</div>
    ${["driver","p176","p101","p100"].map(k => row(k)).join("")}
    ${row("ball_strike", " sgtot")}
    ${row("putting", " sgafter")}
    <div class="sgnote">${holes.length} hole${holes.length === 1 ? "" : "s"} with shots logged</div>
  </div>`;
}

/* ---------- events ---------- */
function commitPutt(i, raw){
  const v = raw === "" ? null : Math.max(0, Math.min(120, Math.round(+raw)));
  setCell(`f.${hole}.p${i}`, Number.isFinite(v) ? v : null);
  // putts count follows the entered distances unless manually stepped later
  const f = F(hole);
  const n = [f.p1, f.p2, f.p3].filter(x => x != null).length;
  setCell(`f.${hole}.putts`, n || null);
  render();
}

function bind(){
  const h = HOLES[hole-1];
  document.querySelectorAll("[data-act]").forEach(el => {
    el.onclick = () => {
      const act = el.dataset.act;
      const f = F(hole);
      if (act==="prev"){ hole=Math.max(1,hole-1); editing=null; render(); }
      else if (act==="next"){ hole=Math.min(18,hole+1); editing=null; render(); }
      else if (act==="inc"||act==="dec"){
        const cur = f.score;
        if (cur==null) setField(hole,"score",parFor(hole));
        else setField(hole,"score",Math.max(1,Math.min(15,cur+(act==="inc"?1:-1))));
      }
      else if (act==="setsum"){ const s = shotSum(hole); if (s!=null) setField(hole,"score",s); }
      else if (act==="tri"){
        const key = el.dataset.key, cur = f[key];
        setField(hole,key, cur==null ? "Y" : cur==="Y" ? "N" : null);
      }
      else if (act==="peninc"||act==="pendec"){
        setField(hole,"pen", Math.max(0,Math.min(6,(f.pen||0)+(act==="peninc"?1:-1))) || null);
      }
      else if (act==="puttinc"||act==="puttdec"){
        const cur = puttCount(hole) || 0;
        setField(hole,"putts", Math.max(0,Math.min(8,cur+(act==="puttinc"?1:-1))) || null);
      }
      else if (act==="addshot"){
        const sh = SH(hole);
        const prev = sh[sh.length-1];
        const db = sh.length ? (prev && prev.da != null ? prev.da : null) : holeYds(h);
        /* caddy prefills: club by yardage, type by distance (both changeable);
           lie=Tee on the opening shot; result stays a deliberate pick */
        editing = { idx:-1, draft:{ club: suggestClub(db, sh.length===0, parFor(hole)),
          lie: sh.length? null : "Tee", db, da:null, type:null, acc:null } };
        render();
        const ed = document.querySelector(".editor");
        if (ed) ed.scrollIntoView({block:"center"});
      }
      else if (act==="caddy"){
        grabCaddyInputs();
        caddyIn.out = caddyIn.dist == null ? "Give me a distance first."
          : caddyPick(caddyIn.dist, caddyIn.dir, caddyIn.mph || 0, caddyIn.cap);
        $("#caddyout").innerHTML = caddyIn.out;
      }
      else if (act==="putt"){
        grabPuttInputs();
        puttIn.out = puttRead();
        $("#puttout").innerHTML = puttIn.out;
      }
      else if (act==="edshot"){
        const i = +el.dataset.i;
        editing = { idx:i, draft:{...SH(hole)[i]} };
        render();
      }
      else if (act==="delshot"){
        const i = +el.dataset.i;
        const arr = SH(hole).slice(); arr.splice(i,1);
        dispShiftAfterDelete(hole, i);
        setShots(hole, arr);
      }
      else if (act==="gpsjump"){ hole = +el.dataset.h; render(); }
      else if (act==="edsave"){
        const d = editing.draft;
        d.club = $("#ed-club").value || null;
        d.lie = $("#ed-lie").value || null;
        d.acc = accJoin(Array.from(
          document.querySelectorAll(".edtag.on"), b => b.dataset.tag));
        d.db = numOrNull($("#ed-db").value);
        d.da = numOrNull($("#ed-da").value);
        const isFirst = editing.idx === -1 ? SH(hole).length === 0 : editing.idx === 0;
        d.type = $("#ed-type").value || suggestType(isFirst, d.db);
        if (!d.club || !d.lie || !d.acc || d.db == null){
          alert("Need club, lie, result and a start distance."); return;
        }
        /* Dispersion is read and written HERE, off `editing.disp`, and never
           off `d`. `d` is spread into the shot object below and from there
           into buildRoundJSON and the sheet; nothing from the dispersion block
           may ride along. */
        const dv = dispEffective(d);
        const dTyped = String(dv.long_ft) !== "" || String(dv.right_ft) !== "";
        if (dTyped){
          const derrs = dispValidate(dv);
          if (derrs.length){
            /* He started a capture — say what is missing rather than dropping
               it silently or storing half a shot. The shot itself is not saved
               yet, so nothing he typed is lost. */
            alert("Approach dispersion needs: " + derrs.join(", ") +
                  ".\n\nOne box is enough - the sheet works the other one out from "
                  + "your first putt. Or clear both to save the shot without it.");
            return;
          }
        }
        const arr = SH(hole).slice();
        const wasNew = editing.idx === -1;
        if (wasNew) arr.push({...d}); else arr[editing.idx] = {...d};
        /* Store against the index this shot now occupies. Separate store,
           separate key — the round record above is already final. */
        const dIdx = wasNew ? arr.length - 1 : editing.idx;
        if (dTyped) dispUpsert(hole, dIdx, dispDerive(dv));
        /* chain: if a new shot didn't finish on the green, auto-open the next
           one prefilled from this finish — no second "Add shot" tap */
        if (wasNew && d.da != null){
          const nb = d.da;
          editing = { idx:-1, draft:{ club: suggestClub(nb, false, parFor(hole)),
            lie: accLie(d.acc), db:nb, da:null, type:null, acc:null } };
        } else {
          editing = null;
        }
        setShots(hole, arr);
        const ed = document.querySelector(".editor");
        if (ed) ed.scrollIntoView({block:"center"});
      }
      else if (act==="edcancel"){ editing = null; render(); }
      else if (act==="zoom"){ bookZoom = true; render(); }
      else if (act==="zoomclose"){ bookZoom = false; render(); }
      else if (act==="pinclear"){ clearPin(hole); }
      else if (act==="saveround"){ saveRound(); }
      else if (act==="reset"){ clearRound(); }
    };
  });
  /* keep the open editor's values through any re-render (sync events etc.) */
  document.querySelectorAll(".edtag").forEach(b => {
    b.onclick = () => {
      b.classList.toggle("on");
      editing.draft.acc = accJoin(Array.from(
        document.querySelectorAll(".edtag.on"), x => x.dataset.tag));
      /* The Finish chips decide the unit of the two Miss boxes — Green means
         feet, anything else means yards. Relabel in place rather than
         re-rendering: a full render on every tag tap would rebuild the editor
         under his thumb, and only these two words actually change. */
      const lbls = document.querySelectorAll(".dspmiss .edlbl");
      if (lbls.length === 2){
        const u = dispEffective(editing.draft).unit === "yd" ? "yd" : "ft";
        lbls[0].textContent = `Left / right (${u})`;
        lbls[1].textContent = `Short / long (${u})`;
      }
    };
  });
  paintRecoveryHint();
  const edSync = { "ed-club":"club", "ed-lie":"lie", "ed-type":"type" };
  for (const [id, key] of Object.entries(edSync)){
    const el = document.getElementById(id);
    if (el) el.onchange = () => {
      editing.draft[key] = el.value || null;
      paintRecoveryHint();   /* the club changes the answer */
    };
  }
  for (const [id, key] of [["ed-db","db"],["ed-da","da"]]){
    const el = document.getElementById(id);
    if (el) el.onchange = () => {
      editing.draft[key] = numOrNull(el.value);
      if (key === "db"){
        /* keep the Auto label honest when the start distance changes */
        const isFirst = editing.idx === -1 ? SH(hole).length === 0 : editing.idx === 0;
        const t = suggestType(isFirst, editing.draft.db);
        const opt = document.querySelector("#ed-type option[value='']");
        if (opt) opt.textContent = t ? `Auto: ${t}` : "Auto";
      }
      paintRecoveryHint();
    };
  }
  /* the two Miss distances — the only dispersion inputs, and they write to
     editing.disp and nowhere else */
  for (const [id, key] of [["dsp-long","long_ft"],["dsp-right","right_ft"]]){
    const el = document.getElementById(id);
    if (!el) continue;
    /* keep the value on every keystroke so a sync re-render cannot eat it */
    el.oninput  = () => { editing.disp = editing.disp || {}; editing.disp[key] = el.value; };
    el.onchange = () => { editing.disp = editing.disp || {}; editing.disp[key] = el.value; };
  }
  document.querySelectorAll("[data-parov]").forEach(el => {
    /* Stored as round state, not a page setting: the pick belongs to THIS round,
       rides the sync channel to any other device, and a new round starts from
       the card again. */
    el.onclick = () => { setCell(`par.${hole}`, +el.dataset.parov); render(); };
  });
  document.querySelectorAll("[data-teeov]").forEach(el => {
    el.onclick = () => { setCell(`tee.${hole}`, el.dataset.teeov); render(); };
  });
  document.querySelectorAll("[data-view]").forEach(el => {
    el.onclick = () => { bookView = el.dataset.view; gpsSyncWatch(); render(); };
  });
  document.querySelectorAll("[data-cad]").forEach(el => {
    el.onclick = () => { grabCaddyInputs(); grabPuttInputs(); caddyTab = el.dataset.cad; render(); };
  });
  document.querySelectorAll("[data-wind]").forEach(el => {
    el.onclick = () => { windTab = el.dataset.wind; render(); };
  });
  /* stimp + slope drive the break chart below them — re-render on change */
  ["#pt-stimp", "#pt-slope"].forEach(sel => {
    const el = $(sel);
    if (el) el.onchange = () => { grabPuttInputs(); render(); };
  });
  document.querySelectorAll("[data-pm]").forEach(el => {
    el.onclick = () => commitMiss(el.dataset.pm, el.dataset.pmv);
  });
  document.querySelectorAll("[data-putt]").forEach(el => {
    el.onchange = () => commitPutt(+el.dataset.putt, el.value.trim());
  });
  const note = $("#holenote");
  if (note) note.onchange = () => setField(hole, "note", note.value.trim() || null);
  const rn = $("#rnote");
  if (rn) rn.onchange = () => { setCell("rnote", rn.value.trim()); };
  document.querySelectorAll('[data-role="clubtap"]').forEach(el => {
    el.addEventListener("click", e => {
      const r = el.getBoundingClientRect();
      if (r.width < 50 || r.height < 50) return;   // image not laid out yet
      const cl = v => Math.max(0, Math.min(1, v));
      clubPick[hole] = { x:cl((e.clientX-r.left)/r.width), y:cl((e.clientY-r.top)/r.height) };
      render();
    });
  });
  document.querySelectorAll('[data-role="greentap"]').forEach(el => {
    el.onclick = ev => {
      const r = el.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width;
      const y = (ev.clientY - r.top) / r.height;
      if (x<0 || x>1 || y<0 || y>1) return;
      // no pin yet -> first tap is always the pin; after that the toggle decides
      if (!pins[hole] || greenTap === "pin" || !zdata(hole)) setPin(hole, x, y);
      else setBall(hole, x, y);
    };
  });
  document.querySelectorAll("[data-tap]").forEach(el => {
    el.onclick = () => { greenTap = el.dataset.tap; render(); };
  });
}
const numOrNull = s => { const v = String(s).trim(); if (v==="") return null; const n = Math.round(+v); return Number.isFinite(n) ? Math.max(0, Math.min(700, n)) : null; };

document.querySelectorAll(".tab").forEach(b => {
  b.addEventListener("click", () => {
    tab=b.dataset.tab; bookZoom=false; editing=null;
    /* The GPS card now sits in the hole card, so the watch and the wake lock
       follow the HOLE tab rather than a tab of their own. A course with no
       baked pack never starts either. */
    gpsSyncWatch();
    render();
  });
});

for (let hn = 1; hn <= 18; hn++){
  if (BOOK[hn]){ const im = new Image(); im.src = BOOK[hn].green; _greenImgCache["_img_"+hn] = im; }
}
const firstOpen = HOLES.find(h => F(h.n).score == null);
hole = firstOpen ? firstOpen.n : 18;
gpsSyncWatch();
render();

(async () => {
  try {
    const r = await fetch(`${NTFY}/${TOPIC}/json?poll=1&since=all`);
    const text = await r.text();
    let changed = false;
    for (const line of text.split("\n")){
      if (!line.trim()) continue;
      try {
        const env = JSON.parse(line);
        if (env.event === "message") changed = merge(JSON.parse(env.message)) || changed;
      } catch(e){}
    }
    mode = "live";
    if (changed) lsSave();
    render();
  } catch(e){ mode = "offline"; render(); }

  try {
    const es = new EventSource(`${NTFY}/${TOPIC}/sse`);
    es.onmessage = ev => {
      try {
        const env = JSON.parse(ev.data);
        if (env.event !== "message") return;
        if (merge(JSON.parse(env.message))){ lsSave(); render(); }
      } catch(e){}
    };
    es.onopen = () => { if (mode !== "live"){ mode = "live"; render(); } };
    es.onerror = () => { if (mode === "live"){ mode = "connecting"; render(); } };
  } catch(e){}

  /* if the relay's 12h cache rolled over, re-seed the channel (chunked)
     from whatever this device holds */
  if (Object.keys(state.cells).length) seedChannel();
})();
</script>
