<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0C2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiffany Greens">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<title>Round Tracker — Tiffany Greens Golf Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* US Open / championship identity: deep navy, warm white, tournament red,
   with a Masters-style serif (Playfair Display) for the marks. */
:root{
  --navy:#0C2340; --navy2:#0C2340; --navy3:#0C2340;
  --paper:#F4EFE4; --paper2:#F1EADA;
  --red:#B22234; --red2:#8F1B2A;
  --blue:#0C2340; --gold:#B22234; --gold-deep:#8F1B2A;
  --sage:#8FA0B8; --line:rgba(255,255,255,.13);
  --target:#8FA0B8;
  --serif:'Playfair Display',Georgia,serif;
  --mono:'Spline Sans Mono',ui-monospace,monospace;
  /* aliases so existing rules resolve to the new championship palette */
  --cream:#F4EFE4; --cream-dim:#8FA0B8;
  --pine:#0C2340; --fair:#0C2340; --fair2:#0C2340; --clay:#8F1B2A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#081830;color:var(--paper);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--navy) 0%, #081830 62%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,textarea,select{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.masthead{padding:22px 18px 14px;text-align:center;border-bottom:1px solid var(--line)}
.crest{font-family:var(--mono);font-size:9px;letter-spacing:.42em;color:var(--cream);text-transform:uppercase;margin-bottom:7px}
.wordmark{font-family:var(--serif);font-weight:800;font-size:31px;line-height:1.02;letter-spacing:.01em;color:var(--paper);margin:0 0 5px}
.wordmark em{font-style:italic;color:#B22234}
.rule{width:46px;height:2px;background:var(--gold);margin:0 auto 8px;opacity:.8}
.sub{font-family:var(--mono);font-size:11px;color:var(--sage);letter-spacing:.06em}

.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  background:rgba(9,26,52,.94);backdrop-filter:blur(6px)}
.tab{flex:1;padding:13px 0 11px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--sage);border-bottom:2px solid transparent}
.tab.on{color:var(--cream);border-bottom-color:var(--red)}

.main{flex:1;padding:16px 14px 90px}

/* ---- hole stat card ---- */
.holecard{background:var(--cream);color:#16243A;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.holehead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px dashed rgba(12,35,64,.25)}
.holenum{font-family:var(--serif);font-size:34px;line-height:1;color:#0C2340}
.holemeta{font-family:var(--mono);font-size:12px;color:#5C6B82;text-align:right;line-height:1.5}
.holemeta b{color:#0C2340}
.scorerow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(12,35,64,.12)}
.scorelbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#5C6B82}
.scorelbl .pm{display:block;font-size:13px;font-weight:700;color:#0C2340;letter-spacing:.04em;margin-top:3px}
.step{display:flex;align-items:center;gap:8px}
.stepbtn{width:44px;height:44px;border-radius:12px;background:#0C2340;color:var(--cream);
  font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center}
.stepbtn:active{transform:scale(.95)}
.gross{width:52px;text-align:center;font-family:var(--mono);font-weight:700;font-size:28px;color:#16243A}
.gross.blank{color:#AAB2BE}.gross.birdie{color:#1E8E4F}.gross.over{color:#B22234}

.statgrid{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(12,35,64,.12);flex-wrap:wrap}
.stchip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border-radius:999px;border:1.5px solid rgba(12,35,64,.3);color:#5C6B82}
.stchip.yes{background:#0C2340;border-color:#0C2340;color:#F4EFE4;font-weight:700}
.stchip.no{border-color:rgba(178,34,52,.55);color:#B22234;font-weight:700}
.minstep{display:flex;align-items:center;gap:7px;margin-left:auto}
.minstep .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5C6B82}
.stmini{width:36px;height:36px;border-radius:9px;background:#E7E0CE;color:#0C2340;font-size:17px;
  font-weight:700;display:flex;align-items:center;justify-content:center}
.stmini:active{transform:scale(.94)}
.minstep b{font-family:var(--mono);font-size:16px;color:#16243A;min-width:20px;text-align:center}

.puttrow{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid rgba(12,35,64,.12)}
.puttfield{flex:1;display:flex;flex-direction:column;gap:4px}
.puttfield label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#5C6B82;text-align:center}
.puttfield input{width:100%;padding:10px 4px;border:1.5px solid rgba(12,35,64,.25);border-radius:10px;
  background:#fff;font-family:var(--mono);font-size:16px;font-weight:700;color:#16243A;text-align:center}
.puttfield input:focus{outline:2px solid var(--gold-deep)}
.puttmiss{display:flex;align-items:center;gap:7px;padding:10px 16px 12px;
  border-bottom:1px solid rgba(12,35,64,.12)}
.pmlbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#5C6B82;width:52px;flex:0 0 auto}
.pmchip{font-family:var(--sans);font-size:12px;line-height:1;padding:10px 12px;border-radius:999px;
  border:1.5px solid rgba(12,35,64,.25);background:#F4EFE4;color:#0C2340;cursor:pointer;
  flex:1 1 auto;text-align:center;white-space:nowrap}
.pmchip.on{background:#0C2340;border-color:#0C2340;color:#F4EFE4;font-weight:600}
.putttot{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.putttot .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#5C6B82}
.putttot b{font-family:var(--mono);font-size:22px;color:#0C2340}

/* shots */
.shots{padding:6px 12px 10px}
.shotrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid rgba(12,35,64,.1);font-family:var(--mono);font-size:12.5px;color:#16243A}
.shotrow .n{font-family:var(--serif);font-size:13px;color:#8792A4;width:16px}
.shotrow .d{flex:1;line-height:1.5}
.shotrow .d b{color:#0C2340}
.shotrow .d .acc-bad{color:#B22234;font-weight:700}
.shotbtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 10px;border-radius:8px;background:#E7E0CE;color:#0C2340}
.shotbtn.del{color:#B22234;background:none;border:1px solid rgba(178,34,52,.35)}
.addshot{display:block;width:calc(100% - 8px);margin:8px 4px 2px;padding:11px;border:1.5px dashed rgba(12,35,64,.35);
  border-radius:10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#0C2340;font-weight:700}
.scorehint{font-family:var(--mono);font-size:10.5px;color:#8792A4;padding:2px 8px 8px;text-align:center}
.scorehint b{color:#0C2340}

/* shot editor */
.editor{background:#E7E0CE;border-radius:12px;margin:8px 4px;padding:12px 10px}
.edrow{display:flex;gap:8px}
.edrow + .edrow{margin-top:10px}
.edfield{flex:1;min-width:0}
.edfield .edlbl,.edtaggrp .edlbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#5C6B82;
  margin:0 0 5px;white-space:nowrap}
.edfield input,.edfield select{width:100%;height:46px;padding:0 10px;border:1.5px solid rgba(12,35,64,.25);border-radius:10px;
  background:#fff;font-family:var(--mono);font-size:15px;font-weight:700;color:#16243A;
  -webkit-appearance:none;appearance:none}
.edfield input{text-align:center}
.edfield select:invalid,.edfield select option[value=""]{color:#AAB2BE}
.edfield select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%234B5B44'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:28px}
.edtags{margin-top:12px}
.edtaggrp + .edtaggrp{margin-top:10px}
.edtagrow{display:flex;flex-wrap:nowrap;gap:6px}
.edtagrow + .edtagrow{margin-top:6px}
.edtag{font-family:var(--sans);font-size:12px;line-height:1;padding:10px 12px;border-radius:999px;
  border:1.5px solid rgba(12,35,64,.25);background:#F4EFE4;color:#0C2340;cursor:pointer;
  flex:1 1 auto;text-align:center;white-space:nowrap}
.edtag.on{background:#0C2340;border-color:#0C2340;color:#F4EFE4;font-weight:600}
/* Finish carries five pills per row (Eric, 2026-08-03): slightly tighter
   chips, scoped to the last tag group so Strike and Miss keep the standard
   size. 10px 7px / 11px / 4px is the loosest combo that fits 375px wide. */
.edtags .edtaggrp:last-child .edtag{padding:10px 7px;font-size:11px}
.edtags .edtaggrp:last-child .edtagrow{gap:4px}
.edhint{font-family:var(--mono);font-size:10px;color:#8792A4;margin-top:7px;text-align:center;letter-spacing:.04em}
.edactions{display:flex;gap:8px;margin-top:12px}
.edsave{flex:1;padding:12px;border-radius:10px;background:#0C2340;color:#F4EFE4;
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.edcancel{flex:none;padding:12px 16px;border-radius:10px;border:1px solid rgba(12,35,64,.3);color:#5C6B82;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* approach dispersion — TWO NUMBER BOXES UNDER THE MISS CHIPS, and nothing
   else. The chip above already says which way it missed, so the box only says
   how far, in feet. They reuse .edrow / .edfield / .edlbl unchanged, so the
   editor stays one thing rather than growing a second styled region. */
.dspmiss{margin-top:10px}
/* ---- Caddie GPS (rangefinder card) ----
   Tracker chrome: the same cream card, navy ink and mono numerals as every
   other card on the page. Nothing here encodes meaning as red versus green. */
.gpscard{background:var(--cream);color:#16243A;border-radius:16px;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.gpshead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 12px 12px;border-bottom:1px dashed rgba(12,35,64,.25)}
.gpsarrow{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:1.5px solid rgba(12,35,64,.3);
  font-family:var(--mono);font-size:20px;line-height:1;color:#0C2340;background:transparent}
.gpsarrow[disabled]{opacity:.28}
.gpshole{flex:1;text-align:center}
.gpshole .n{font-family:var(--serif);font-size:34px;line-height:1;color:#0C2340}
.gpshole .p{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5C6B82;margin-top:3px}
.gpsnums{display:flex;align-items:center;justify-content:center;gap:6px;padding:22px 10px 6px}
.gpsn{flex:1;text-align:center}
.gpsn .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#5C6B82}
.gpsn .v{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;color:#16243A;margin-top:6px}
.gpsn.mid .v{font-size:74px;line-height:.92;color:#0C2340}
.gpsn.mid .k{font-size:11px;color:#0C2340;font-weight:700}
.gpsunit{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:#5C6B82;text-align:center;padding:2px 0 14px}
.gpsmeta{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;
  border-top:1px solid rgba(12,35,64,.12);font-family:var(--mono);font-size:10.5px;color:#5C6B82}
.gpsmeta b{color:#0C2340;font-weight:700}
.gpssuggest{margin:0;padding:12px 14px;border-top:1px solid rgba(12,35,64,.12);
  font-family:var(--mono);font-size:11px;color:#16243A;text-align:center}
.gpssuggest button{margin-top:8px;width:100%;padding:12px;border-radius:10px;background:#0C2340;
  color:var(--cream);font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.gpswait{padding:34px 18px;text-align:center;font-family:var(--mono);font-size:12px;
  line-height:1.8;color:#5C6B82}
.gpsflag{padding:11px 14px;border-top:1px solid rgba(12,35,64,.12);
  font-family:var(--mono);font-size:10.5px;line-height:1.6;color:#8F1B2A;text-align:center}
/* per-hole tee override */
.teeovrow{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid rgba(12,35,64,.12)}
.parovrow{display:flex;align-items:center;gap:7px;padding:10px 14px 12px;
  border-bottom:1px solid rgba(12,35,64,.12)}
.povlbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:#5C6B82;flex:0 0 auto}
.povchip{flex:1;font-family:var(--sans);font-size:12px;line-height:1;padding:10px 8px;
  border-radius:999px;border:1.5px solid rgba(12,35,64,.25);background:#F4EFE4;color:#0C2340;
  cursor:pointer;text-align:center;white-space:nowrap}
.povchip.on{background:#0C2340;border-color:#0C2340;color:#F4EFE4;font-weight:600}
.povcard{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  opacity:.65;margin-left:5px}
.teechip{flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:8px 4px;
  border-radius:999px;border:1.5px solid rgba(12,35,64,.25);color:#5C6B82;text-align:center}
.teechip.on{font-weight:700;border-width:2px}
.teechip.tee-blue.on{border-color:#0C2340;color:#0C2340;background:rgba(42,91,158,.08)}
.teechip.tee-red.on{border-color:#B22234;color:#B22234;background:rgba(178,34,52,.08)}
.teechip.tee-yellow.on{border-color:#1E8E4F;color:#1E8E4F;background:rgba(30,142,79,.1)}

/* caddy card */
.caddy{margin-top:14px;background:var(--cream);color:#16243A;border-radius:16px;
  padding:14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.caddyhead{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  color:#5C6B82;margin-bottom:10px;text-align:center}
.caddy .edrow + .edrow{margin-top:8px}
.caddyask{display:block;width:100%;margin-top:10px;padding:13px;border-radius:10px;background:#0C2340;
  color:var(--cream);font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.caddyout{font-family:var(--mono);font-size:13px;color:#16243A;line-height:1.7;padding:10px 4px 0;text-align:center}
.caddyout:empty{display:none}

/* strategy view (see .stratsec block below) */
.strat{padding:2px 2px}

.noterow{padding:10px 14px 14px}
.noterow input{width:100%;padding:11px 12px;border:1.5px solid rgba(12,35,64,.2);border-radius:10px;
  background:#fff;font-size:14px;color:#16243A}
.noterow input::placeholder{color:#AAB2BE}

/* ---- course book ---- */
.book{margin-top:14px;background:var(--cream);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bookbar{display:flex;align-items:stretch;border-bottom:1px solid rgba(12,35,64,.15);background:#E7E0CE}
.bookseg{flex:1;padding:12px 0 11px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#5C6B82;border-bottom:2px solid transparent}
.bookseg.on{background:var(--cream);color:#0C2340;font-weight:700;border-bottom-color:var(--red)}
.bookzoombtn{flex:none;width:52px;font-family:var(--mono);font-size:15px;color:#5C6B82;border-left:1px solid rgba(12,35,64,.15)}
.bookbody{padding:10px 10px 12px}
.bookframe{position:relative;border-radius:10px;overflow:hidden;background:#fff}
.bookimg{width:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.greentap{cursor:crosshair}
.pinmark{position:absolute;width:26px;height:34px;margin-left:-4px;margin-top:-31px;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.targetmark{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border:2.5px dashed var(--target);
  border-radius:50%;pointer-events:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.65) inset}
.targetmark:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
  border-radius:50%;background:var(--target)}
.bookhint{font-family:var(--mono);font-size:10.5px;color:#5C6B82;padding:9px 4px 0;line-height:1.6;text-align:center}
.bookhint b{color:#0C2340}
.bookhint .pinlgnd{color:var(--gold-deep);font-weight:700}
.bookhint .tgtlgnd{color:var(--target);font-weight:700}
.pinclear{display:block;margin:8px auto 0;padding:7px 16px;border:1px solid rgba(178,34,52,.45);border-radius:999px;
  color:#B22234;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase}

/* fullscreen zoom overlay */
.zoom{position:fixed;inset:0;z-index:50;background:rgba(7,20,42,.97);display:flex;flex-direction:column;
  max-width:520px;margin:0 auto}
.zoomhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;flex:none}
.zoomttl{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage)}
.zoomclose{padding:8px 18px;border:1px solid var(--line);border-radius:999px;color:var(--cream);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.zoombody{flex:1;overflow-y:auto;padding:0 14px 20px}
.zoombody .bookframe{border-radius:12px}
.zoombody .bookhint{color:var(--cream-dim)}
.zoombody .bookhint b{color:var(--cream)}
.zoombody .pinclear{border-color:rgba(208,106,69,.5);color:var(--clay)}

.holenav{display:flex;gap:10px;margin-top:14px}
.navbtn{flex:1;padding:14px 0;border-radius:12px;background:var(--fair2);color:var(--cream);
  font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line)}
.navbtn:disabled{opacity:.35}

/* ---- overview ---- */
.totcard{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.tot{background:var(--fair2);padding:13px 8px;text-align:center}
.tot .v{font-family:var(--serif);font-size:22px;color:var(--cream)}
.tot .v em{font-style:normal;color:var(--cream);font-size:15px}
.tot .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin-top:4px}
.secthead{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--sage);margin:20px 0 10px}
.gridwrap{overflow-x:auto;background:var(--cream);border-radius:14px;padding:6px 4px}
.grid{border-collapse:collapse;font-family:var(--mono);font-size:12px;color:#16243A;min-width:100%}
.grid th{font-size:9px;letter-spacing:.14em;color:#5C6B82;padding:6px 5px;text-transform:uppercase;
  border-bottom:1.5px solid #0C2340;text-align:center;font-weight:600}
.grid td{padding:6px 5px;text-align:center;border-bottom:1px solid rgba(12,35,64,.14)}
.grid td.hn{font-weight:700;color:#0C2340}
.grid tr.sumrow td{border-top:2px solid #0C2340;font-weight:700;color:#0C2340}
.sc{font-weight:700}
.sc.bird{color:#1E8E4F}.sc.bog{color:#B22234}
.ok{color:#0C2340;font-weight:700}
.miss{color:#B22234}

  else if (first === 5 && !tail){                      // exact tie -> half to even
    var lastDigit = kept.charCodeAt(kept.length - 1) - 48;
    out = (lastDigit % 2 === 0) ? keptNum : keptNum + step;
  } else out = keptNum;
  out = Number(out.toFixed(places));
  return neg ? -out : out;
}

function sgInterp(dist, col){
  var pts = Object.keys(EXPECTED).map(Number).sort(function(a,b){return a-b;});
  dist = Math.max(pts[0], Math.min(dist, pts[pts.length-1]));
  var lo = pts[0], hi = pts[pts.length-1], i;
  for (i=0;i<pts.length;i++){ if (pts[i] <= dist) lo = pts[i]; }
  for (i=pts.length-1;i>=0;i--){ if (pts[i] >= dist) hi = pts[i]; }
  function val(d){
    var v = EXPECTED[String(d)][col];
    return (v === null || v === undefined) ? EXPECTED[String(d)][1] : v;  // no Tee value -> Fairway
  }
  if (lo === hi) return val(lo);
  var f = (dist - lo) / (hi - lo);
  return val(lo) + f * (val(hi) - val(lo));
}

function sgEStrokes(dist, lie, baseline){
  var col = (lie in LIE_COL) ? LIE_COL[lie] : 2;
  var scratch = sgInterp(dist, col);
  if (baseline === "scratch") return scratch;
  var pen = 0.0045 * dist + 0.05;
  var disc = dist <= 50 ? 0.4 : dist <= 100 ? 0.7 : 1.0;
  pen *= SCALE[baseline] * disc;
  if (lie === "Sand") pen *= 1.10;
  return scratch + pen;
}

function sgEPutts(feet, baseline){
  for (var i=0;i<PUTTING.length;i++){
    var r = PUTTING[i];
    if (feet >= r[0] && feet <= r[1]) return r[2 + BASE_IDX[baseline]];
  }
  return PUTTING[PUTTING.length-1][2 + BASE_IDX[baseline]];
}

function sgCategory(shot, idx){
  var club = String(shot.club || "").trim().toLowerCase();
  if (idx === 0 && shot.type === "Drive" &&
      (club === "d" || club === "driver" || club === "md" || club === "mini driver")) return "driver";
  var d = shot.dist_before || 0;
  if (d >= 176) return "p176";
  if (d >= 101) return "p101";
  return "p100";
}

function sgNextLie(shots, i){
  return (i + 1 < shots.length) ? (shots[i+1].lie || "Rough") : "Rough";
}

/* SG per category for one hole, for one baseline (default 9hcp). */
function holeSG(hole, baseline){
  baseline = baseline || "9hcp";
  /* `excluded` holds the recovery shots. Not a category, never displayed:
     it exists so the conservation identity still balances, because every
     stroke must be accounted for somewhere even when it is kept out of the
     four buckets and out of ball_strike. */
  var out = {driver:0, p176:0, p101:0, p100:0, putting:0, ball_strike:0, excluded:0};
  var shots = hole.shots || [];
  var p1 = (hole.p1_ft === undefined) ? null : hole.p1_ft;
  var putts = hole.putts_tm || 0;

  for (var i=0;i<shots.length;i++){
    var s = shots[i];
    var cat = sgCategory(s, i);
    var db = (s.dist_before === undefined) ? null : s.dist_before;
    var da = (s.dist_after === undefined) ? null : s.dist_after;
    if (db === null) continue;
    var start = sgEStrokes(db, s.lie || "Rough", baseline);
    var penal = sgIsPenalty(s.acc);
    var nxt = (i + 1 < shots.length) ? shots[i+1] : null;
    var fin;
    if (nxt !== null && nxt.dist_before !== null && nxt.dist_before !== undefined){
      /* Where this shot finished IS where the next one starts. Chaining off the
         next shot's start rather than this shot's dist_after makes the hole
         telescope, so the categories sum to E(start) - score exactly. */
      fin = sgEStrokes(nxt.dist_before, nxt.lie || "Rough", baseline);
    } else if (da !== null){
      fin = sgEStrokes(da, sgNextLie(shots, i), baseline);
    } else if (penal){
      /* Ball gone with nothing logged after it: the replay is from the same
         spot, so finish equals start and the two strokes charged below make
         this exactly -2.00. Charging a flat -1.00 here (the old behaviour)
         dropped the wasted shot and broke the identity. */
      fin = start;
    } else {
      /* finish putt valued on the SCRATCH table for every baseline: the shot
         carries the shot-model gap, putting carries the putting-table gap.
         Per-baseline finish inverted p100 across baselines (2026-07-23). */
      fin = (p1 !== null) ? sgEPutts(p1, "scratch") : 1.0;
    }
    var key = sgIsRecovery(s, i) ? "excluded" : cat;
    out[key] += start - (1 + fin);
    if (penal) out[key] += -1.0;
  }
  if (p1 !== null && putts) out.putting = sgEPutts(p1, baseline) - putts;
  out.ball_strike = out.driver + out.p176 + out.p101 + out.p100;
  for (var k in out) out[k] = sgRound(out[k], 3);
  return out;
}

/* Round totals: sum every hole, same six categories. */
function roundSG(holes, baseline){
  var tot = {driver:0, p176:0, p101:0, p100:0, putting:0, ball_strike:0, excluded:0};
  (holes || []).forEach(function(h){
    var s = holeSG(h, baseline);
    SG_KEYS.forEach(function(k){ tot[k] += s[k]; });
  });
  SG_KEYS.forEach(function(k){ tot[k] = sgRound(tot[k], 2); });
  /* Ball Strike is the SUM OF THE FOUR SHOT CATEGORIES and is displayed as
     their subtotal, so it has to add up in the numbers actually shown.
     Totalling it independently across 18 holes left it off the sum of the
     displayed parts by up to 0.03 -- invisible at 1dp, visible at 2dp. */
  tot.ball_strike = sgRound(tot.driver + tot.p176 + tot.p101 + tot.p100, 2);
  return tot;
}
</script>
<script>
/* Approach dispersion — the shared, pure core.
 *
 * Loaded by BOTH surfaces and nowhere else:
 *   - the round tracker (skills/round-tracker/template.html, inlined by
 *     skills/osm-course-book/build_tracker.py) — capture;
 *   - the Golf Hub (design/golf-hub/index.html) — the two maps.
 * The Hub embeds this file verbatim between the DISP-MODULE markers;
 * tests/test_dispersion.py fails if the two copies drift.
 *
 * Pure functions only: no DOM, no storage, no fetch. Everything that decides a
 * sign, a band or a distance lives here so the tracker and the Hub can never
 * disagree about what a logged shot means.
 *
 * HARD BOUNDARIES (do not relax):
 *   - This module never reads or writes the putt-distance field (p1/p2/p3).
 *     Putting strokes gained depends on exactly one logged number and that
 *     stays true.
 *   - Dispersion is its own store, keyed by round date + course + hole. It is
 *     never part of the round record, buildRoundJSON, the Apps Script payload
 *     or the Google Sheet.
 *   - NO BACKFILL. Nothing here estimates, infers or reconstructs a component
 *     from putt distance or any other proxy. A round logged before these
 *     fields existed has no dispersion data and never will. Both maps start
 *     empty and fill going forward. That is intended.
 */

var DISP_VERSION = 1;

/* ---------- capture vocabulary ---------- */

/* Lie the approach was played FROM. A 40 yard shot from fairway and one from
   thick rough are different populations, so this is a filter, not a label. */
var DISP_LIES = ["Fairway", "Rough", "Sand", "Other"];

/* Where the ball finished relative to the putting surface. Encoded as dot
   SHAPE on the map, never as colour. */
var DISP_FINISH = ["On green", "Off green"];

/* The unsigned direction words Eric actually taps. He never types a minus
   sign; the sign is derived here, once, at import. */
var DISP_LONG_DIRS  = ["long", "short"];
var DISP_RIGHT_DIRS = ["right", "left"];

/* ---------- distance bands (yards played from) ----------
   Toggles, not separate fixed charts. min inclusive, max exclusive, so a
   shot from exactly 25 yards lands in "25-50" and 50 lands in "50-75". */
var DISP_BANDS = [
  { key: "u25",     label: "Inside 25", min: 0,   max: 25,       rep: 15  },
  { key: "25-50",   label: "25-50",     min: 25,  max: 50,       rep: 37  },
  { key: "50-75",   label: "50-75",     min: 50,  max: 75,       rep: 62  },
  { key: "75-100",  label: "75-100",    min: 75,  max: 100,      rep: 87  },
  { key: "100-125", label: "100-125",   min: 100, max: 125,      rep: 112 },
  { key: "125-175", label: "125-175",   min: 125, max: 175,      rep: 150 },
  { key: "175-200", label: "175-200",   min: 175, max: 200,      rep: 187 },
  { key: "200+",    label: "200+",      min: 200, max: Infinity, rep: 215 }
];

function dispBandFor(yards) {
  if (yards == null || !isFinite(yards) || yards < 0) return null;
  for (var i = 0; i < DISP_BANDS.length; i++) {
    var b = DISP_BANDS[i];
    if (yards >= b.min && yards < b.max) return b.key;
  }
  return null;
}

function dispBand(key) {
  for (var i = 0; i < DISP_BANDS.length; i++) {
    if (DISP_BANDS[i].key === key) return DISP_BANDS[i];
  }
  return null;
}

/* The tracker's own Lie list is finer-grained than the four dispersion flags.
   Folding happens here so the tracker and the Hub agree, and so the block can
   prefill from the shot Eric already logged instead of asking twice.
   Deep Rough folds into Rough; Tee and Recovery into Other. */
function dispLieFromShotLie(lie) {
  switch (String(lie || "").trim().toLowerCase()) {
    case "fairway":    return "Fairway";
    case "rough":
    case "deep rough": return "Rough";
    case "sand":       return "Sand";
    case "tee":
    case "recovery":
    case "other":      return "Other";
    default:           return null;
  }
}

/* Which shots get a dispersion block offered without being asked. The three
   App types are approaches by definition; a par-3 tee shot is one too, and the
   tracker types it "Drive", so the caller passes par and isFirst. Any other
   shot can still be opened by hand — this decides the DEFAULT, not the limit. */
function dispIsApproach(type, par, isFirst) {
  if (isFirst && par === 3) return true;
  return ["Long App (176+)", "Mid App (101-175)", "Short App (100&In)"].indexOf(type) !== -1;
}

/* ---------- the unit he is typing in ----------
   The two boxes under the Miss chips change unit with where the ball finished:
   ON THE GREEN he measures in FEET, anywhere else in YARDS. Nobody says "my
   ball is nine feet into the rough" or "I was six yards past the pin".

   Storage stays in FEET always, so the maps, the green reference and the
   proximity ramp all speak one unit and never have to ask. The conversion
   happens once, here, at import — the same place the sign is decided. */
var DISP_FT_PER_YD = 3;

function dispUnit(onGreen) { return onGreen ? "ft" : "yd"; }

function dispToFeet(value, unit) {
  if (value === null || value === undefined || value === "") return null;
  var n = typeof value === "number" ? value : Number(value);
  if (!isFinite(n)) return null;
  return unit === "yd" ? n * DISP_FT_PER_YD : n;
}

/* The way back out, for re-opening a saved shot. Storage is feet; the box has
   to show the number he actually typed, in the unit he typed it in. Without
   this a shot entered as 20 yards re-opened reading 60 against a "yd" label,
   and saving it again stored 180 — wrong by 3x, then 9x, silently. */
function dispFromFeet(feet, unit) {
  if (feet === null || feet === undefined || feet === "") return null;
  var n = typeof feet === "number" ? feet : Number(feet);
  if (!isFinite(n)) return null;
  return unit === "yd" ? n / DISP_FT_PER_YD : n;
}

/* Which way it missed, from the Miss chips.
   The chips are a MULTI-SELECT describing the shape of the shot, so nothing
   stops both ends of an axis being on at once. When they are, the direction is
   genuinely ambiguous and this returns "" — which makes the distance
   unresolvable and puts it in front of him, rather than quietly taking
   whichever one happened to be tested first. That silent guess once stored a
   short miss as +60 long. */
function dispDirFrom(tags, positiveWord, negativeWord) {
  var list = tags || [];
  var cap = function (w) { return w.charAt(0).toUpperCase() + w.slice(1); };
  var pos = list.indexOf(cap(positiveWord)) !== -1;
  var neg = list.indexOf(cap(negativeWord)) !== -1;
  if (pos && neg) return "";          // ambiguous — refuse, do not pick
  if (pos) return positiveWord;
  if (neg) return negativeWord;
  return "";
}

/* ---------- sign derivation ----------
   The one place a direction word becomes a sign.
     short -> negative leave_long_ft      long  -> positive
     left  -> negative leave_right_ft     right -> positive
   A ZERO component is zero whatever the direction says, and the direction may
   be blank — pin high is leave_long_ft = 0, and dead on line is
   leave_right_ft = 0. Zero is a real, complete answer, not a missing one.

   Anything else that cannot be resolved returns null rather than a guess: a
   non-zero distance with no direction tapped, a negative number (he never
   types one, so a minus is a bug or a paste, not an intent), or junk. Callers
   treat null as "not plottable yet" and dispValidate() says why. */

function dispSignedComponent(ft, dir, negativeWord) {
  if (ft === null || ft === undefined || ft === "") return null;
  var n = typeof ft === "number" ? ft : Number(ft);
  if (!isFinite(n)) return null;
  if (n < 0) return null;              // unsigned input only — never flip it silently
  if (n === 0) return 0;               // direction is irrelevant and may be blank
  if (!dir) return null;               // non-zero needs a side
  var d = String(dir).trim().toLowerCase();
  if (d === negativeWord) return -n;
  return n;
}

function dispSignedLong(ft, dir) {
  /* dir: "long" | "short" | blank when ft is 0 */
  if (dir && DISP_LONG_DIRS.indexOf(String(dir).trim().toLowerCase()) === -1) return null;
  return dispSignedComponent(ft, dir, "short");
}

function dispSignedRight(ft, dir) {
  /* dir: "right" | "left" | blank when ft is 0 */
  if (dir && DISP_RIGHT_DIRS.indexOf(String(dir).trim().toLowerCase()) === -1) return null;
  return dispSignedComponent(ft, dir, "left");
}

/* ---------- the computed leave ----------
   NEVER logged. Always computed from the two components, so there is exactly
   one representation of the miss and no second number to drift. */
function dispLeaveFt(leaveLongFt, leaveRightFt) {
  if (leaveLongFt === null || leaveLongFt === undefined) return null;
  if (leaveRightFt === null || leaveRightFt === undefined) return null;
  if (!isFinite(leaveLongFt) || !isFinite(leaveRightFt)) return null;
  return Math.sqrt(leaveLongFt * leaveLongFt + leaveRightFt * leaveRightFt);
}

/* ---------- import ----------
   Turns one raw capture into the stored record. This is "import" in the sense
   the spec means it: the moment unsigned taps become signed fields. Both
   leave fields are optional in storage so a round logged without dispersion
   stays valid — a record missing them simply never reaches a map. */
function dispDerive(input) {
  input = input || {};
  /* `unit` is what the boxes were showing when he typed: "ft" on the green,
     "yd" anywhere else. Convert first, then take the sign, so the stored
     fields are always feet no matter which way he entered them. */
  var unit = input.unit === "yd" ? "yd" : "ft";
  var lng = dispSignedLong(dispToFeet(input.long_ft, unit), input.long_dir);
  var rgt = dispSignedRight(dispToFeet(input.right_ft, unit), input.right_dir);
  var yards = input.played_from_yds;
  var y = (yards === null || yards === undefined || yards === "") ? null : Number(yards);
  if (y !== null && (!isFinite(y) || y < 0)) y = null;
  var rec = {
    v: DISP_VERSION,
    played_from_yds: y,
    lie: DISP_LIES.indexOf(input.lie) !== -1 ? input.lie : null,
    finish: DISP_FINISH.indexOf(input.finish) !== -1 ? input.finish : null,
    /* provenance: which unit the boxes were showing. The stored leaves are
       always feet, but knowing he typed yards is what makes a wrong-looking
       dot debuggable later instead of a mystery. */
    entered_unit: unit
  };
  /* Optional by design — omitted entirely rather than written as null, so an
     older record and a partial one are the same shape. */
  if (lng !== null) rec.leave_long_ft = lng;
  if (rgt !== null) rec.leave_right_ft = rgt;
  return rec;
}

/* What is still missing before this capture can be plotted. Returns [] when
   the record is complete. The UI shows these; nothing is inferred. */
function dispValidate(input) {
  input = input || {};
  var errs = [];
  /* Name the unit he is actually typing in, so an alert never tells him
     "in feet" while the box above it says yards. */
  var u = input.unit === "yd" ? "yards" : "feet";
  var hasLong = !(input.long_ft === null || input.long_ft === undefined || input.long_ft === "");
  var hasRight = !(input.right_ft === null || input.right_ft === undefined || input.right_ft === "");
  /* ONE LEG IS ENOUGH (Eric, 2026-08-16: "i wasnt allowed to hit submit unless
     i had both filled in. i dont like that... the google sheet will auto
     calcuate the missing one if i put one in since it has the putt distance").
     The sheet's DISPERSION AUTO-COMPLETE trigger solves the right triangle
     BT^2 = BR^2 + BS^2 from the first putt distance, so typing the leg he
     actually paced off is all the information the system needs. Requiring both
     made him measure a number the sheet was about to compute anyway.

     Still required: a direction chip for whichever box he DID fill, because a
     magnitude with no side is unplottable and cannot be recovered later. */
  if (!hasLong && !hasRight) errs.push("A short/long OR left/right distance in " + u);
  if (hasLong && dispSignedLong(input.long_ft, input.long_dir) === null) {
    errs.push(Number(input.long_ft) > 0 ? "the SHORT or LONG chip" : "a valid short/long distance");
  }
  if (hasRight && dispSignedRight(input.right_ft, input.right_dir) === null) {
    errs.push(Number(input.right_ft) > 0 ? "the LEFT or RIGHT chip" : "a valid left/right distance");
  }
  if (DISP_LIES.indexOf(input.lie) === -1) errs.push("Lie");
  if (DISP_FINISH.indexOf(input.finish) === -1) errs.push("On or off green");
  var y = Number(input.played_from_yds);
  if (input.played_from_yds === null || input.played_from_yds === undefined ||
      input.played_from_yds === "" || !isFinite(y) || y < 0) {
    errs.push("Distance played from, in yards");
  }
  return errs;
}

/* A stored record is plottable only when BOTH components survived derivation.
   No half-shots on the map. */
function dispIsPlottable(rec) {
  return !!rec &&
    typeof rec.leave_long_ft === "number" && isFinite(rec.leave_long_ft) &&
    typeof rec.leave_right_ft === "number" && isFinite(rec.leave_right_ft) &&
    typeof rec.played_from_yds === "number" && isFinite(rec.played_from_yds);
}

/* ---------- the store key ----------
   Round date + course + hole, exactly as the spec requires, so the dispersion
   store stands on its own and never has to be joined through the round record.
   Shot index disambiguates two approaches on one hole. */
function dispKey(date, course, hole) {
  return [String(date || ""), String(course || ""), String(hole == null ? "" : hole)].join("|");
}

/* ---------- proximity ramp ----------
   Blue to orange, never red to green. Every band carries its own text label so
   the map reads without colour at all. */
var DISP_PROXIMITY = [
  { key: "p0",  label: "Inside 5 ft",  min: 0,  max: 5,        color: "#1F4E9D" },
  { key: "p5",  label: "5-15 ft",      min: 5,  max: 15,       color: "#3E7CC4" },
  { key: "p15", label: "15-30 ft",     min: 15, max: 30,       color: "#7FA9D8" },
  { key: "p30", label: "30-60 ft",     min: 30, max: 60,       color: "#E0A35A" },
  { key: "p60", label: "Over 60 ft",   min: 60, max: Infinity, color: "#C2701B" }
];

function dispProximity(leaveFt) {
  if (leaveFt == null || !isFinite(leaveFt) || leaveFt < 0) return null;
  for (var i = 0; i < DISP_PROXIMITY.length; i++) {
    var p = DISP_PROXIMITY[i];
    if (leaveFt >= p.min && leaveFt < p.max) return p;
  }
  return null;
}

/* ---------- reference ring ----------
   A REFERENCE SHAPE, not a boundary. A 21 ft circle around the pin — Eric's
   pick (2026-08-03, replacing the 90x66 ft median-green ellipse: "make it
   more of a circle and being at 21ft"). Equal semi-axes ARE the circle;
   nothing else changes shape when these two numbers agree. */
var DISP_GREEN_REF = { semi_long_ft: 21, semi_right_ft: 21 };

/* ---------- axis auto-scale ----------
   The axis follows the dots that are actually switched on, symmetric about the
   pin so the centre stays the centre, with headroom past the widest one.

   It deliberately does NOT floor on the green reference. Flooring there meant a
   set of wedge shots inside 10 ft still drew on a +/-60 ft axis and collapsed
   into the middle — exactly the squashing the band toggles exist to prevent.
   The green ellipse simply runs past the frame when he is well inside it,
   which is itself the right reading. DISP_AXIS_MIN only stops a card of
   tap-ins zooming to nothing. Returns feet. */
var DISP_AXIS_MIN = 15;

function dispAxisRange(records) {
  var maxAbs = 0;
  (records || []).forEach(function (r) {
    if (!dispIsPlottable(r)) return;
    maxAbs = Math.max(maxAbs, Math.abs(r.leave_long_ft), Math.abs(r.leave_right_ft));
  });
  var span = Math.max(maxAbs * 1.15, DISP_AXIS_MIN);
  /* round up to a readable tick so the printed range is a number he can hold */
  var step = span <= 30 ? 5 : span <= 60 ? 10 : span <= 150 ? 25 : 50;
  return Math.ceil(span / step) * step;
}

/* ---------- wide-selection warning ----------
   Long shots squash the wedge dots into the centre. Warn when the switched-on
   bands span a wide range of distances played from — measured as the ratio of
   the longest to the shortest representative yardage in the selection. */
var DISP_SPAN_RATIO = 3;

function dispSpanWarning(bandKeys) {
  var reps = (bandKeys || []).map(dispBand).filter(Boolean).map(function (b) { return b.rep; });
  if (reps.length < 2) return null;
  var lo = Math.min.apply(null, reps), hi = Math.max.apply(null, reps);
  if (hi / lo < DISP_SPAN_RATIO) return null;
  return "Wide selection: " + Math.round(hi / lo) + "x span from the shortest band to the " +
         "longest. The long shots will squash the wedge dots into the centre — " +
         "switch bands off to read them.";
}

/* ---------- selection ---------- */
function dispSelect(records, bandKeys, lies) {
  return (records || []).filter(function (r) {
    if (!dispIsPlottable(r)) return false;
    if (bandKeys && bandKeys.length) {
      if (bandKeys.indexOf(dispBandFor(r.played_from_yds)) === -1) return false;
    }
    if (lies && lies.length) {
      if (lies.indexOf(r.lie) === -1) return false;
    }
    return true;
  });
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    DISP_VERSION: DISP_VERSION, DISP_LIES: DISP_LIES, DISP_FINISH: DISP_FINISH,
    DISP_BANDS: DISP_BANDS, DISP_PROXIMITY: DISP_PROXIMITY,
    DISP_GREEN_REF: DISP_GREEN_REF, DISP_SPAN_RATIO: DISP_SPAN_RATIO,
    DISP_FT_PER_YD: DISP_FT_PER_YD, dispUnit: dispUnit, dispToFeet: dispToFeet,
    dispFromFeet: dispFromFeet, dispDirFrom: dispDirFrom,
    DISP_AXIS_MIN: DISP_AXIS_MIN,
    dispBandFor: dispBandFor, dispBand: dispBand,
    dispLieFromShotLie: dispLieFromShotLie, dispIsApproach: dispIsApproach,
    dispSignedComponent: dispSignedComponent,
    dispSignedLong: dispSignedLong, dispSignedRight: dispSignedRight,
    dispLeaveFt: dispLeaveFt, dispDerive: dispDerive, dispValidate: dispValidate,
    dispIsPlottable: dispIsPlottable, dispKey: dispKey,
    dispProximity: dispProximity, dispAxisRange: dispAxisRange,
    dispSpanWarning: dispSpanWarning, dispSelect: dispSelect
  };
}
</script>
<script>
/* Caddie GPS — the pure distance core.
 *
 * Inlined into the round tracker by skills/osm-course-book/build_tracker.py,
 * alongside the course's baked GPS pack. No DOM, no geolocation, no fetch: the
 * page hands this a position and a green and gets yards back, which is what
 * makes it testable against fixed coordinates.
 *
 * READ-ONLY FEATURE. Nothing here or in the view it feeds writes a round,
 * touches the Apps Script, or touches the Google Sheet.
 *
 * Everything works offline. The green polygons are baked into the page by
 * scripts/../build_gps_pack.py; no Overpass call ever happens on the course.
 */

/* Mean Earth radius (IUGG), in yards. Using one constant here and in the
   Python baker keeps the two from disagreeing about what a yard is. */
var GPS_R_YDS = 6371008.8 * 1.0936132983377078;

function gpsHaversineYds(lat1, lon1, lat2, lon2) {
  var p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
  var dp = p2 - p1;
  var dl = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dp / 2) * Math.sin(dp / 2) +
          Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
  return 2 * GPS_R_YDS * Math.asin(Math.min(1, Math.sqrt(a)));
}

/* FRONT / MIDDLE / BACK for one green.
 *
 * FRONT is the MINIMUM distance across the densified polygon points and BACK
 * is the MAXIMUM — which is why the baker densifies edges to ~2 m. On a raw
 * OSM ring the nearest mapped node can sit well off the true near edge, and
 * front would read to a corner instead of to the front of the green.
 *
 * MIDDLE is the polygon centroid, not the mean of front and back: on a
 * kidney-shaped green those are different points, and the centroid is the one
 * that matches where a middle pin actually sits.
 *
 * Front and back are defined by distance from where he is standing, so they
 * stay correct from any angle of approach — which is the whole point of them
 * not being fixed "front edge" and "back edge" markers. */
function gpsGreenDistances(lat, lon, green) {
  if (!green || !green.points || !green.points.length) return null;
  var min = Infinity, max = -Infinity;
  for (var i = 0; i < green.points.length; i++) {
    var d = gpsHaversineYds(lat, lon, green.points[i][0], green.points[i][1]);
    if (d < min) min = d;
    if (d > max) max = d;
  }
  var mid = green.middle
    ? gpsHaversineYds(lat, lon, green.middle.lat, green.middle.lon)
    : (min + max) / 2;
  return { front: min, middle: mid, back: max };
}

/* Nearest hole by green centre. This only ever SUGGESTS: the view shows it and
   waits for a tap. Auto-advancing mid-hole because he walked past the next tee
   is how a rangefinder loses trust. */
function gpsNearestHole(lat, lon, holes) {
  var best = null, bestD = Infinity;
  for (var i = 0; i < (holes || []).length; i++) {
    var g = holes[i].green;
    if (!g || !g.middle) continue;
    var d = gpsHaversineYds(lat, lon, g.middle.lat, g.middle.lon);
    if (d < bestD) { bestD = d; best = holes[i].hole; }
  }
  return best === null ? null : { hole: best, yards: bestD };
}

/* Yards are whole numbers. Nobody plays a half yard, and a decimal on a
   rangefinder reads as false precision. */
function gpsYds(v) {
  return (v == null || !isFinite(v)) ? null : Math.round(v);
}

/* Accuracy comes from the device in METRES. Shown as-is with its unit rather
   than converted, so it cannot be mistaken for another yardage. */
function gpsAccuracyLabel(metres) {
  if (metres == null || !isFinite(metres)) return "GPS accuracy unknown";
  return "GPS +/- " + Math.round(metres) + " m";
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    GPS_R_YDS: GPS_R_YDS,
    gpsHaversineYds: gpsHaversineYds,
    gpsGreenDistances: gpsGreenDistances,
    gpsNearestHole: gpsNearestHole,
    gpsYds: gpsYds,
    gpsAccuracyLabel: gpsAccuracyLabel
  };
}

let editing = null;      // null | {idx, draft:{...}}  idx===-1 -> new shot
let mode = "connecting";
let lastExport = null;
let caddyIn = { dist:null, cap:null, mph:null, dir:"calm", out:"" };
let caddyTab = "swing";     // swing | dist | wind | putt
let windTab = "into";       // into | down  (inside the Wind chart)
let puttIn = { len:null, slope:"2", stimp:"10", ud:"flat", out:"" };

const isPinKey = k => k.startsWith("pin.") || k.startsWith("ball.");
const validPinVal = v => v === null ||
  (v && typeof v.x === "number" && typeof v.y === "number" && isFinite(v.x) && isFinite(v.y));
const validShotArr = v => Array.isArray(v) && v.every(s => s && typeof s === "object");
const validCell = (k, c) => {
  if (!c || typeof c.t !== "number") return false;
  if (isPinKey(k)) return validPinVal(c.v);
  if (k.startsWith("sh.")) return validShotArr(c.v);
  return c.v === null || typeof c.v === "number" || typeof c.v === "string";
};

function derive(){
  fields = {}; shots = {}; pins = {}; balls = {}; teeOv = {}; parOv = {}; tee = "blue"; rnote = "";
  for (const [k, c] of Object.entries(state.cells)){
    if (c.t <= state.resetAt) continue;
    if (k.startsWith("ball.")){ if (c.v) balls[k.slice(5)] = c.v; continue; }
    if (isPinKey(k)){ const hn = k.slice(4); if (c.v) pins[hn] = c.v; continue; }
    if (k.startsWith("sh.")){ shots[k.slice(3)] = c.v; continue; }
    if (k === "tee"){ if (TEES.includes(c.v)) tee = c.v; continue; }
    if (k.startsWith("tee.")){ if (TEES.includes(c.v)) teeOv[k.slice(4)] = c.v; continue; }
    /* A par override is honoured ONLY for a hole the course file declared
       flexible, and only for a value it offered. The cell arrives over a public
       ntfy topic from another device; without this, anything could rescore any
       hole. An override for a hole that is no longer flexible is ignored, so
       rebuilding the course with the par settled retires the old cell. */
    if (k.startsWith("par.")){
      const hn = k.slice(4);
      if ((PAR_OPTIONS[hn] || []).includes(c.v)) parOv[hn] = c.v;
      continue;
    }
    if (k === "rnote"){ rnote = typeof c.v === "string" ? c.v : ""; continue; }
    if (k.startsWith("f.")){
      const [, hn, key] = k.split(".");
      if (!fields[hn]) fields[hn] = {};
      fields[hn][key] = c.v;
    }
  }
}
function merge(incoming){
  if (!incoming || typeof incoming !== "object" || !incoming.cells) return false;
  let changed = false;
  if ((incoming.resetAt||0) > state.resetAt){ state.resetAt = incoming.resetAt; changed = true; }
  for (const [k, c] of Object.entries(incoming.cells || {})){
    if (!validCell(k, c)) continue;
    if (!state.cells[k] || c.t > state.cells[k].t){ state.cells[k] = c; changed = true; }
  }
  if (changed) derive();
  return changed;
}
function lsLoad(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.cells) state = s; }catch(e){} derive(); }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- writes ----------
   ntfy.sh truncates/attaches bodies over ~4 KB, so NEVER post the whole
   state: publish only the cells dirtied since the last successful send,
   and re-seed the channel in small chunks. */
let pubTimer = null;
const dirty = new Set();
async function postMsg(payload){
  await fetch(`${NTFY}/${TOPIC}`, { method:"POST", body: JSON.stringify(payload) });
}
function publish(){
  clearTimeout(pubTimer);
  pubTimer = setTimeout(async () => {
    const keys = [...dirty];
    const payload = { cells:{}, resetAt: state.resetAt };
    for (const k of keys) if (state.cells[k]) payload.cells[k] = state.cells[k];
    try {
      await postMsg(payload);
      keys.forEach(k => dirty.delete(k));
      if (mode !== "live") { mode = "live"; render(); }
    } catch(e){ mode = "offline"; render(); }
  }, 350);
}
async function seedChannel(){
  /* replay everything we hold, 12 cells per message to stay under the cap */
  const keys = Object.keys(state.cells);
  for (let i = 0; i < keys.length; i += 12){
    const payload = { cells:{}, resetAt: state.resetAt };
    for (const k of keys.slice(i, i+12)) payload.cells[k] = state.cells[k];
    try { await postMsg(payload); } catch(e){ return; }
  }
}
function setCell(key, val){
  state.cells[key] = { v: val, t: Date.now() };
  dirty.add(key);
  derive(); lsSave(); publish();
}
const setField = (hn, key, val) => { setCell(`f.${hn}.${key}`, val); render(); };
const setShots = (hn, arr) => { setCell(`sh.${hn}`, arr); render(); };
function setPin(holeN, x, y){
  setCell(`pin.${holeN}`, {x:+x.toFixed(4), y:+y.toFixed(4)});
  greenTap = "ball";                 // pin's down — next tap is where you're putting from
  applyPuttGeom(holeN); render();
}
function setBall(holeN, x, y){
  setCell(`ball.${holeN}`, {x:+x.toFixed(4), y:+y.toFixed(4)});
  applyPuttGeom(holeN); render();
}
function clearPin(holeN){
  setCell(`pin.${holeN}`, null); setCell(`ball.${holeN}`, null);
  greenTap = "pin"; render();
}
function clearBall(holeN){
  setCell(`ball.${holeN}`, null); greenTap = "ball"; render();
}
function clearRound(){
  if (!confirm("Wipe this round from every device?")) return;
  state = { cells: {}, resetAt: Date.now() };
  dirty.clear();
  hole = 1; editing = null; derive(); lsSave();
  postMsg({ cells:{}, resetAt: state.resetAt }).catch(()=>{});
  render();
}

/* ---------- helpers ---------- */
/* THE ONE PLACE a hole's par is decided. Everything -- scoring, GIR, FIR,
   the strategy card, the club suggestion, the scorecard table and the payload
   that reaches the sheet -- reads par through here, so a hole declared flexible
   cannot be par 5 in the header and par 4 in the strokes-gained card. */
const parFor = hn => parOv[hn] ?? HOLES[hn - 1].par;
const parIsPicked = hn => parOv[hn] != null;
const F = hn => fields[hn] || {};
const SH = hn => shots[hn] || [];
const clubPick = {};                      // hole -> {x,y}, local only
const teeFor = hn => teeOv[hn] || tee;           // per-hole override, else default
const holeYds = h => h.yds[teeFor(h.n)];
const suggestType = (isFirst, db) => isFirst ? "Drive"
  : db == null ? null : db >= 176 ? "Long App (176+)" : db >= 101 ? "Mid App (101-175)" : "Short App (100&In)";
function suggestClub(db, isFirst, par){
  if (db == null) return null;
  if (isFirst && par !== 3) return "D";
  let best = null, bestScore = 1e9;
  for (const c of CLUBS){
    const spec = CADDY[c];
    if (!spec) continue;
    const carry = spec.c[0];
    const score = carry < db ? (db - carry) * 1.25 : carry - db;
    if (score < bestScore){ bestScore = score; best = c; }
  }
  return best;
}
/* Putt miss - ONE row, four chips, FIRST PUTT ONLY (Eric, 2026-08-16: "Just
   put it on one line under. It needs to be like the miss like within the shot.
   just simple. mostly wanting to know for a miss on the first putt. dont care
   about a miss on the second shot right now.").

   Deliberately the same four words and the same row shape as the shot MISS
   chips, so there is one thing to learn rather than two. Left/Right and
   Short/Long are independent: tap either, both, or neither, and tap a lit chip
   to clear it. Blank means it went in, or that he did not look.

   Left/Right answers "was the read wrong". Short/Long answers "was the speed
   wrong". Those are the two questions his 08/16 round could not settle - he
   knew his line "didnt match my eye" over the first five holes and the log had
   no field to confirm it. */
const MISS_SIDE  = {Left: "L", Right: "R"};
const MISS_DEPTH = {Short: "Short", Long: "Long"};

function puttMissBlock(f){
  const chip = (label, axis, val) => `<button type="button" class="pmchip${
    f["m1" + axis] === val ? " on" : ""}" data-pm="${axis}" data-pmv="${val}">${label}</button>`;
  return `<div class="puttmiss"><span class="pmlbl">P1 miss</span>` +
    Object.keys(MISS_SIDE).map(k => chip(k, "s", MISS_SIDE[k])).join("") +
    Object.keys(MISS_DEPTH).map(k => chip(k, "d", MISS_DEPTH[k])).join("") +
    `</div>`;
}

function commitMiss(axis, val){
  /* Tapping the lit chip clears it - the same toggle the strike and finish
     chips use. Nothing here is ever required. */
  const f = F(hole);
  setCell(`f.${hole}.m1${axis}`, f["m1" + axis] === val ? null : val);
  render();
}

/* RECOVERY NUDGE (Eric, 2026-08-16).
   `suggestType` fills Type from the distance alone, so a ball hit sideways out
   of trees from 250 yards is auto-labelled "Long App (176+)". On 08/16 all four
   of Eric's tree holes carried an approach type for exactly that reason, and
   the only honest marker on them was a hand-added `Layup` tag.

   Recovery shots are now EXCLUDED from strokes gained, so this tag decides
   whether a shot is scored at all - which makes getting it right at entry time
   matter more, not less.

   HALF the club's carry is the threshold, deliberately conservative so a
   genuine layup or knockdown does not trip it. Eric's 08/16 punch-outs
   advanced 25, 65 and 87 yards on a 7 iron that carries 184.

   It NUDGES, it never rewrites. The type he picks is the type that is stored. */
var RECOVERY_RATIO = 0.5;
function recoveryHint(club, db, da){
  if (!club || db == null || da == null) return null;
  var spec = CADDY[club];
  if (!spec || !spec.c) return null;
  var carry = spec.c[0];
  var went = db - da;
  if (!(went > 0) || went >= carry * RECOVERY_RATIO) return null;
  return { went: Math.round(went), carry: Math.round(carry) };
}

/* Painted IN PLACE, never by re-rendering: the shot editor deliberately does
   not re-render while open because that steals focus mid-entry, which is why
   the "Auto: <type>" label is also kept current by hand. */
function paintRecoveryHint(){
  var box = document.getElementById("ed-recovery");
  if (!box || !editing) return;
  var d = editing.draft;
  var r = recoveryHint(d.club, d.db, d.da);
  if (!r){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = "That went <b>" + r.went + " yd</b> on a club that carries <b>" +
    r.carry + "</b>. If you had no swing at it, set Type to <b>Punch Out</b> or " +
    "<b>Layup</b> - otherwise it is scored as an approach you missed.";
}

function puttCount(hn){
  const f = F(hn);
  if (f.putts != null) return f.putts;
  const n = [f.p1, f.p2, f.p3].filter(v => v != null).length;
  return n || null;
}
/* FIR/GIR auto-derived from the shots; a tap on the chip cycles
   auto -> Y -> N -> auto (manual override stored in f.fir/f.gir).
   FIR reads the TEE SHOT's own finishing lie from its Result tags — shot 2's
   lie is only trustworthy when no penalty intervened (a drop that lands in
   the fairway is not a fairway hit). Mirrors auto_fir/auto_gir in
   skills/round-tracker/pull_round.py. */
const FINISH_TAGS = new Set([].concat(...ACC_GROUPS.find(g => g[0] === "Finish")[1]));
function autoFir(h){
  if (parFor(h.n) === 3) return null;
  const sh = SH(h.n);
  if (!sh.length) return null;
  const fin = accTags(sh[0].acc).filter(t => FINISH_TAGS.has(t));
  if (fin.length) return fin.includes("Fairway") ? "Y" : "N";
  if ((F(h.n).pen || 0) === 0 && sh.length >= 2)
    return sh[1].lie === "Fairway" ? "Y" : "N";
  return null;
}
function autoGir(h){
  /* (score - putts) <= par - 2. Penalty strokes are already in the score,
     so no shot-by-shot reconstruction is needed or wanted. */
  const score = F(h.n).score;
  const putts = puttCount(h.n);
  if (score == null || putts == null) return null;
  return (score - putts) <= (parFor(h.n) - 2) ? "Y" : "N";
}
const effFir = h => { const v = F(h.n).fir; return v ? v : autoFir(h); };
const effGir = h => { const v = F(h.n).gir; return v ? v : autoGir(h); };
function shotSum(hn){
  const p = puttCount(hn) || 0, pen = F(hn).pen || 0;
  const s = SH(hn).length;
  return s ? s + p + pen : null;
}
function plusMinus(score, par){
  if (score == null) return "";
  const d = score - par;
  return d === 0 ? "E" : d > 0 ? `+${d}` : `${d}`;
}
function totals(){
  let score=0, par=0, thru=0, f9=0, b9=0, fwH=0, fwP=0, girH=0, girP=0, putts=0, pen=0,
      udC=0, udX=0;
  for (const h of HOLES){
    const f = F(h.n);
    if (f.score == null) continue;
    thru++; score += f.score; par += parFor(h.n);
    if (h.n <= 9) f9 += f.score; else b9 += f.score;
    const fir = effFir(h), gir = effGir(h);
    if (parFor(h.n) !== 3 && (fir === "Y" || fir === "N")){ fwP++; if (fir === "Y") fwH++; }
    if (gir === "Y" || gir === "N"){ girP++; if (gir === "Y") girH++; }
    putts += puttCount(h.n) || 0;
    pen += f.pen || 0;
    /* up & down, auto-derived: missed GIR, last non-putt shot from <=50y,
       holed out with <=1 putt at par or better */
    if (gir === "N"){
      const sh = SH(h.n);
      const last = sh[sh.length - 1];
      if (last && last.db != null && last.db <= 50){
        udX++;
        if ((puttCount(h.n) || 0) <= 1 && f.score <= parFor(h.n)) udC++;
      }
    }
  }
  return {score, par, thru, f9, b9, fwH, fwP, girH, girP, putts, pen, udC, udX};
}

/* ---------- round JSON export (raw — SG computed at ingestion) ---------- */
function buildRoundJSON(){
  const t = totals();
  const holesOut = HOLES.map(h => {
    const f = F(h.n);
    const sh = SH(h.n).map(s => ({
      club: CLUB_EXPORT[s.club] || s.club,
      lie: s.lie,
      dist_before: s.db ?? null,
      dist_after: s.da ?? null,
      type: s.type,
      acc: s.acc
    }));
    return {
      hole: h.n, par: parFor(h.n), yds: holeYds(h),
      shots: sh,
      p1_ft: f.p1 ?? null, p2_ft: f.p2 ?? null, p3_ft: f.p3 ?? null,
      /* Putt miss, first two putts. '' rather than null when unset so the
         Apps Script writes a blank cell instead of the word "null". */
      p1_miss_side: f.m1s ?? "", p1_miss_depth: f.m1d ?? "",
      putts_tm: puttCount(h.n) ?? 0,
      score: f.score ?? null,
      plus_minus: plusMinus(f.score, parFor(h.n)),
      fir: parFor(h.n) === 3 ? null : effFir(h),
      gir: effGir(h),
      penalty: f.pen || 0,
      notes: f.note || "",
      ...dispForHole(h.n)
    };
  });
  const yardage = HOLES.reduce((a,h)=>a+holeYds(h),0);  // per-hole effective tees
  return {
    round: {
      /* the round's par follows the holes actually played, so a flexible
         hole picked as a 5 makes this a 72 rather than the card's 71 */
      date: ROUND.date, course: ROUND.course,
      par: HOLES.reduce((a, x) => a + parFor(x.n), 0),
      tees: tee, yardage,
      score: t.score, front_9: t.f9, back_9: t.b9,
      fairways_hit: t.fwH, fairways_possible: 14,
      fairways_pct: `${Math.round(t.fwH/14*100)}%`,
      gir: t.girH, gir_pct: `${(t.girH/18*100).toFixed(1)}%`,
      putts_tm: t.putts,
      notes: rnote || ""
    },
    holes: holesOut
  };
}
function breakdownText(data){
  /* compact plain-text copy of every shot — the email backup */
  const L = [];
  const r = data.round;
  L.push(`ROUND TRACKER - ${r.course} - ${r.date} (${r.tees} default)`);
  L.push(`Score ${r.score} (${r.front_9}/${r.back_9}) - FW ${r.fairways_hit}/14 - GIR ${r.gir} - Putts ${r.putts_tm}`);
  L.push("");
  for (const h of data.holes){
    const sh = h.shots.map(s =>
      `${s.club} ${s.lie} ${s.dist_before}>${s.dist_after ?? "grn"} ${s.acc}`).join("; ");
    const putts = [h.p1_ft, h.p2_ft, h.p3_ft].filter(v => v != null).join(",");
    const flags = [h.fir === "Y" ? "FIR" : h.fir === "N" ? "no-FIR" : "",
                   h.gir === "Y" ? "GIR" : h.gir === "N" ? "no-GIR" : "",
                   h.penalty ? `PEN ${h.penalty}` : ""].filter(Boolean).join(" ");
    L.push(`H${h.hole} P${h.par} ${h.yds}y: ${sh || "-"} | putts ${putts || "-"} (${h.putts_tm}) | ${h.score ?? "-"} ${h.plus_minus} ${flags}${h.notes ? " | " + h.notes : ""}`);
  }
  if (r.notes){ L.push(""); L.push("Notes: " + r.notes); }
  return L.join("\n");
}
async function saveRound(){
  /* the round data itself is already on the channel cell-by-cell; re-seed to
     be safe, drop a "saved" marker for Home Base, and email Eric a full
     breakdown so a copy exists even if everything else has an issue. */
  const data = buildRoundJSON();
  lastExport = JSON.stringify(data, null, 1);
  let sent = false;
  try {
    await seedChannel();
    const marker = { kind:"round_saved", t: Date.now(), score: data.round.score, page: location.href, topic: TOPIC,
                     /* The round's OWN date. Without it the reader had to scrape the
                        page's build-time ROUND constant, which is why every rebuilt
                        round landed on the date the page was generated. */
                     date: data.round.date };
    await postMsg(marker);
    try { await fetch(`${NTFY}/${DISPATCH}`, { method:"POST", body: JSON.stringify(marker) }); } catch(e){}
    sent = true;
  } catch(e){}
  /* Post the finished round straight to the sheet. The page is holding the
     real round object right now; nothing downstream has to reconstruct it. */
  let landed = null, sheetErr = null;
  /* applySG writes rnd.sg_round and every hole's sg_hole straight into the
     sheet's three strokes-gained bands. buildRoundJSON does NOT compute them --
     the Overview calls the engine separately -- so posting its output alone
     landed a round with EVERY strokes-gained cell blank, round and all 18 holes
     (2026-07-25, Shoal Creek, Rounds row 14). Compute all three baselines here,
     from the same engine the Overview uses, before anything is sent. */
  const SG_BASES = ["scratch", "5hcp", "9hcp"];
  data.round.sg_round = {};
  SG_BASES.forEach(function(b){ data.round.sg_round[b] = roundSG(data.holes, b); });
  data.holes.forEach(function(h){
    h.sg_hole = {};
    SG_BASES.forEach(function(b){ h.sg_hole[b] = holeSG(h, b); });
  });
  try {
    const resp = await fetch(SHEET_HOOK, { method:"POST", headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({ token: SHEET_TOKEN, round: data.round, holes: data.holes }) });
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || "sheet said not-ok");
    landed = j;
  } catch(e){
    sheetErr = String(e).slice(0,160);
    /* No server to fall back on: drop a marker on a topic Eric subscribes to.
       The round is still on the channel and in the clipboard, so nothing is
       lost -- he just needs to know it did not reach the sheet. */
    try {
      await fetch(`${NTFY}/${SAVE_ALERT}`, { method:"POST",
        headers:{ "Title": "Golf save did not reach the sheet", "Priority": "high" },
        body: `${ROUND.course} ${data.round.date}: ${sheetErr}` });
    } catch(_){}
  }
  let copied = false;
  try { await navigator.clipboard.writeText(lastExport); copied = true; } catch(e){}
  const el = document.querySelector("#saveout");
  if (el) el.innerHTML =
      (landed ? `<div style="margin-bottom:8px;font-weight:600">Saved to the sheet - row ${landed.row}, ${landed.date}</div>`
              : sheetErr ? `<div style="margin-bottom:8px;font-weight:600">NOT saved to the sheet: ${sheetErr}</div>` : "")
      + saveOutHTML(sent, copied, data);
  /* auto-open the mail app with the full breakdown pre-filled so a copy
     always reaches Eric's inbox — he just taps Send */
  const mailto = mailtoFor(data);
  if (mailto){ try { window.location.href = mailto; } catch(e){} }
}
function mailtoFor(data){
  if (!data) return "";
  return `mailto:${EMAIL}?subject=${encodeURIComponent(
    `Round Tracker - ${ROUND.course} ${ROUND.date}`)}&body=${encodeURIComponent(breakdownText(data))}`;
}
function saveOutHTML(sent, copied, data){
  const bits = [];
  bits.push(sent ? "Round is on the channel — tell Home Base <b>pull my round</b> (it emails you the full copy)."
                 : "Channel unreachable — use the JSON below.");
  bits.push("Your mail app should open with the full shot-by-shot breakdown — just hit Send.");
  bits.push(copied ? "Full JSON also copied to clipboard." : "Copy the JSON below.");
  const mailto = mailtoFor(data);
  return `<div class="msg">${bits.join("<br>")}</div>
    ${mailto ? `<a class="mailbtn" href="${mailto}">Email me a copy</a>` : ""}
    <textarea readonly onclick="this.select()">${lastExport ? lastExport.replace(/&/g,"&amp;").replace(/</g,"&lt;") : ""}</textarea>`;
}

/* ---------- caddy engine (otto_golf wind chart) ---------- */
const WIND_DIRS = [
  {id:"calm", label:"Calm"},
  {id:"into", label:"Into (headwind)"},
  {id:"down", label:"Down (tailwind)"},
  {id:"lr",   label:"Cross, L to R"},
  {id:"rl",   label:"Cross, R to L"},
  {id:"il",   label:"Into, off the left"},
  {id:"ir",   label:"Into, off the right"},
  {id:"dl",   label:"Down, off the left"},
  {id:"dr",   label:"Down, off the right"}
];
function windInterp(vals, calm, mph){
  /* vals = [[c,t]@5,[c,t]@10,[c,t]@20]; linear between 0/5/10/20, hold past 20 */
  const pts = [[0, calm], [5, vals[0]], [10, vals[1]], [20, vals[2]]];
  const m = Math.max(0, Math.min(mph, 20));
  for (let i = 1; i < pts.length; i++){
    if (m <= pts[i][0]){
      const [m0, v0] = pts[i-1], [m1, v1] = pts[i];
      const f = (m - m0) / (m1 - m0 || 1);
      return [v0[0] + f*(v1[0]-v0[0]), v0[1] + f*(v1[1]-v0[1])];
    }
  }
  return pts[3][1];
}
function driftInterp(vals, mph){
  const pts = [[0,0],[5,vals[0]],[10,vals[1]],[20,vals[2]]];
  const m = Math.max(0, Math.min(mph, 20));
  for (let i = 1; i < pts.length; i++){
    if (m <= pts[i][0]){
      const [m0,v0] = pts[i-1], [m1,v1] = pts[i];
      return v0 + (m-m0)/(m1-m0||1)*(v1-v0);
    }
  }
  return vals[2];
}
function caddyEval(club, dir, mph){
  const s = CADDY[club];
  let ct, drift = 0, shape = "";
  if (dir === "into") ct = windInterp(s.h, s.c, mph);
  else if (dir === "down") ct = windInterp(s.t, s.c, mph);
  else if (dir === "il" || dir === "ir") ct = windInterp(s.i, s.c, mph);
  else if (dir === "dl" || dir === "dr") ct = windInterp(s.d, s.c, mph);
  else ct = [s.c[0], s.c[1]];
  if (dir === "lr") drift = driftInterp(s.xl, mph);
  else if (dir === "rl") drift = driftInterp(s.xr, mph);
  else if (dir === "il" || dir === "dl"){ drift = 0.7 * driftInterp(s.xl, mph); shape = "adds to your fade"; }
  else if (dir === "ir" || dir === "dr"){ drift = 0.7 * driftInterp(s.xr, mph); shape = "flies straighter than the stock fade"; }
  return { carry: ct[0], total: ct[1], drift, shape };
}
function caddyPick(dist, dir, mph, cap){
  let best = null;
  for (const c of CLUBS){
    if (!CADDY[c]) continue;
    const e = caddyEval(c, dir, mph);
    if (cap != null && e.total > cap) continue;
    const score = e.carry < dist ? (dist - e.carry) * 1.25 : e.carry - dist;
    if (!best || score < best.score) best = { club: c, score, ...e };
  }
  if (!best) return "No club fits under that cap.";
  const wc = Math.round(best.carry), wt = Math.round(best.total);
  const windy = dir !== "calm" && mph > 0;
  const head = windy
    ? `${best.club} plays ${wc} (${wt}) in this wind.`
    : `${best.club} - ${wc} (${wt}).`;
  const lines = [head];
  const d = Math.round(Math.abs(best.drift));
  if (d >= 2){
    const side = best.drift > 0 ? "right" : "left";
    const aim = best.drift > 0 ? "left" : "right";
    lines.push(`Wind pushes it ~${d} yds ${side} - aim ${d} yds ${aim} of target.`);
  } else if (dir !== "calm" && mph > 0){
    lines.push("Play it straight at your target.");
  }
  if (best.shape) lines.push(`Shape: ${best.shape}.`);
  if (dist < 90){
    let feel = SHORT_GAME[0];
    for (const f of SHORT_GAME) if (Math.abs(f[0]-dist) < Math.abs(feel[0]-dist)) feel = f;
    lines.push(`Short game (${feel[0]} yd feel): ${feel[1]}.`);
  }
  return lines.join("<br>");
}

/* ---------- computed hole strategy (Eric's numbers, not generic advice) ---------- */
function clubFor(dist){
  let best = null, bs = 1e9;
  for (const c of CLUBS){
    if (!CADDY[c]) continue;
    const carry = CADDY[c].c[0];
    const score = carry < dist ? (dist - carry) * 1.25 : carry - dist;
    if (score < bs){ bs = score; best = c; }
  }
  return best;
}

/* ---------- green pin read: sample the elevation heatmap at the pin ---------- */
const _greenImgCache = {};
function sampleGreen(holeN, x, y){
  const meta = BOOK[holeN];
  if (!meta) return null;
  let c = _greenImgCache[holeN];
  if (!c){
    const img = _greenImgCache["_img_"+holeN];
    if (!img || !img.complete || !img.naturalWidth) return null;
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const ctx = cv.getContext("2d", { willReadFrequently:true });
    ctx.drawImage(img, 0, 0);
    c = _greenImgCache[holeN] = ctx;
  }
  try {
    const W = c.canvas.width, H = c.canvas.height;
    let r=0,g=0,b=0,n=0, rad=Math.max(3, Math.round(W*0.03));
    const px = Math.round(x*W), py = Math.round(y*H);
    const d = c.getImageData(Math.max(0,px-rad), Math.max(0,py-rad), rad*2, rad*2).data;
    for (let i=0;i<d.length;i+=4){ if (d[i+3]<10) continue; r+=d[i];g+=d[i+1];b+=d[i+2];n++; }
    if (!n) return null;
    return { r:r/n, g:g/n, b:b/n };
  } catch(e){ return null; }
}
function pinAdvice(holeN){
  const p = pins[holeN];
  const col = sampleGreen(holeN, p.x, p.y);
  const front = p.y > 0.60, back = p.y < 0.40;
  const parts = [];
  if (col){
    const high = col.r > col.b + 22 && col.r > 140;
    const low  = col.b > col.r + 18 && col.b > 130;
    if (high) parts.push("Pin's on the <b>high shelf</b> — downhill, slick putts. Leave your approach <b>below the hole</b> and lag the first one.");
    else if (low) parts.push("Pin sits <b>low</b> — uphill putt, be firm and take the break out.");
    else parts.push("Pin's on a <b>flatter section</b> — a makeable look if you're on the right tier.");
  }
  if (back) parts.push("Back pin: take one more club, don't short-side yourself.");
  else if (front) parts.push("Front pin: spin it or land it soft — long leaves a downhill comeback.");
  return parts.join(" ");
}

/* ---------- suggested target: pin pulled 45% toward green centroid ---------- */
function targetFor(holeN){
  const p = pins[holeN], meta = BOOK[holeN];
  if (!p || !meta) return null;
  const [cx, cy, r] = meta.c, f = meta.fall || [0, 1];
  let tx = p.x + 0.45*(cx - p.x) + 0.10*f[0];
  let ty = p.y + 0.45*(cy - p.y) + 0.10*f[1];
  const dx = tx - cx, dy = ty - cy, dd = Math.hypot(dx, dy), lim = r*1.35;
  if (dd > lim){ tx = cx + dx*lim/dd; ty = cy + dy*lim/dd; }
  return { x: tx, y: ty };
}

/* ================= Caddie GPS =================
   A READ-ONLY view. It never writes a round, never touches the Apps Script and
   never touches the sheet — it only reads GPS_PACK, which build_tracker.py
   inlines from skills/osm-course-book/gps/<slug>.json.

   Fully offline: the green polygons are baked into this page, so no network
   call happens on the course. The only external input is the device's own
   position. GPS_PACK is null in the template and for any course without a
   baked pack; the tab is not rendered at all in that case. */
var GPS_PACK = null;
let gpsPos = null;     // {lat, lon, acc} from watchPosition
let gpsErr = null;
let gpsWatchId = null;
let gpsWakeLock = null;

function gpsHoleData(n){
  if (!GPS_PACK) return null;
  return GPS_PACK.holes.find(h => h.hole === n) || null;
}

async function gpsAcquireWakeLock(){
  /* Keep the screen alive while he is walking with the card open. Wrapped
     because Screen Wake Lock is unsupported on some browsers and rejects
     outright when the document is hidden — neither is an error worth showing. */
  try {
    if ("wakeLock" in navigator && !gpsWakeLock){
      gpsWakeLock = await navigator.wakeLock.request("screen");
      gpsWakeLock.addEventListener("release", () => { gpsWakeLock = null; });
    }
  } catch(e){ gpsWakeLock = null; }
}
function gpsReleaseWakeLock(){
  try { if (gpsWakeLock) gpsWakeLock.release(); } catch(e){}
  gpsWakeLock = null;
}
/* A wake lock is dropped whenever the page is hidden — a lock screen, an app
   switch, a phone call. Re-acquire when it comes back, or the screen starts
   sleeping again halfway round. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && gpsWanted()){
    gpsAcquireWakeLock();
    gpsStartWatch();
  } else if (document.visibilityState !== "visible"){
    gpsWakeLock = null;              // the browser already released it
  }
});

/* The GPS card lives in the hole card, so it is wanted whenever the hole tab
   is showing and this course has a baked pack. */
function gpsWanted(){ return !!GPS_PACK && tab === "hole" && bookView === "gps"; }

function gpsSyncWatch(){
  if (gpsWanted()){ gpsStartWatch(); gpsAcquireWakeLock(); }
  else { gpsStopWatch(); gpsReleaseWakeLock(); }
}

function gpsStartWatch(){
  if (!GPS_PACK || gpsWatchId !== null || !navigator.geolocation) return;
  gpsWatchId = navigator.geolocation.watchPosition(
    p => {
      gpsErr = null;
      gpsPos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      if (gpsWanted()) render();
    },
    e => {
      gpsErr = e && e.message ? e.message : "position unavailable";
      if (gpsWanted()) render();
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
  );
}
function gpsStopWatch(){
  /* Stop the moment he leaves the tab. A high-accuracy watch left running is a
     battery drain for a card nobody is looking at. */
  if (gpsWatchId !== null && navigator.geolocation){
    try { navigator.geolocation.clearWatch(gpsWatchId); } catch(e){}
  }
  gpsWatchId = null;
}

/* The GPS card lives INSIDE the hole card, at the bottom of it and directly
   above the hole changer (Eric, 2026-08-02: "i dont like the GPS on the top as
   a tab. i want it on the HOLE or CLUB Section at like the bottom of that but
   above the hole changer").

   So it carries NO hole/par header and NO arrows of its own. The hole card
   above already says which hole this is, and the hole changer immediately
   below is the one control that moves holes -- two sets of hole arrows a
   thumb apart is exactly the duplicate control he has objected to before.
   Returns "" for a course with no baked pack, so nothing renders rather than
   a card that cannot answer. */
function viewGPS(){
  if (!GPS_PACK) return "";
  const h = gpsHoleData(hole);

  if (!gpsPos){
    return `<div class="gpscard">
      <div class="gpswait">${gpsErr
        ? "No position yet &mdash; " + esc(gpsErr) + ".<br>Allow location for this site, then come back."
        : "Finding you&hellip;<br>Allow location if your phone asks."}</div>
    </div>`;
  }

  const d = h ? gpsGreenDistances(gpsPos.lat, gpsPos.lon, h.green) : null;
  const near = gpsNearestHole(gpsPos.lat, gpsPos.lon, GPS_PACK.holes);
  /* SUGGEST ONLY. The card never advances itself: walking past the next tee,
     or a GPS wobble, must not move the hole out from under him. */
  const suggest = (near && near.hole !== hole)
    ? `<div class="gpssuggest">Nearest green is <b>${near.hole}</b>, ${gpsYds(near.yards)} yd away.
         <button data-act="gpsjump" data-h="${near.hole}">Switch to ${near.hole}</button></div>`
    : "";
  const flag = (h && h.green && h.green.flagged)
    ? `<div class="gpsflag">This hole has no mapped green. The numbers come from the end of the
         hole line, so treat them as approximate.</div>`
    : "";

  return `<div class="gpscard">
    <div class="gpsnums">
      <div class="gpsn"><div class="k">Front</div><div class="v">${d ? gpsYds(d.front) : "&ndash;"}</div></div>
      <div class="gpsn mid"><div class="k">Middle</div><div class="v">${d ? gpsYds(d.middle) : "&ndash;"}</div></div>
      <div class="gpsn"><div class="k">Back</div><div class="v">${d ? gpsYds(d.back) : "&ndash;"}</div></div>
    </div>
    <div class="gpsunit">Yards</div>
    <div class="gpsmeta">
      <span>${esc(gpsAccuracyLabel(gpsPos.acc))}</span>
      <span><b>${esc(GPS_PACK.name)}</b></span>
    </div>
    ${flag}${suggest}
  </div>`;
}
